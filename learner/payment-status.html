<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173b8f">

<title>Payment Status | Mule Learner Tuition</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.header{
    background:#173b8f;
    color:white;
    padding:18px 15px;
    text-align:center;
}

.header h2{
    margin:0;
    font-size:21px;
}

.container{
    max-width:500px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.status{
    text-align:center;
    padding:20px 10px;
    border-radius:12px;
    margin-bottom:15px;
}

.status h3{
    margin:8px 0;
    font-size:20px;
}

.status p{
    margin:6px 0;
    line-height:1.5;
}

.green{
    background:#e8f7ed;
    color:#137333;
}

.yellow{
    background:#fff8df;
    color:#8a6500;
}

.red{
    background:#fdeaea;
    color:#b42318;
}

.gray{
    background:#eef1f5;
    color:#555;
}

.info{
    margin-top:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid #eee;
}

.row:last-child{
    border-bottom:none;
}

.label{
    color:#777;
}

.value{
    font-weight:bold;
    text-align:right;
}

button{
    width:100%;
    border:none;
    background:#173b8f;
    color:white;
    padding:13px;
    border-radius:10px;
    font-size:16px;
    margin-top:15px;
}

.back{
    background:#555;
}
</style>
</head>

<body>

<div class="header">
    <h2>💳 Payment Status</h2>
</div>

<div class="container">

    <div class="card">

        <div id="statusBox" class="status gray">
            <div style="font-size:32px;">⏳</div>
            <h3>Checking Status...</h3>
            <p>Please wait.</p>
        </div>

        <div id="paymentInfo" class="info"></div>

        <button onclick="loadPaymentStatus()">🔄 Refresh Status</button>

        <button class="back" onclick="location.href='dashboard.html'">
            ← Back to Dashboard
        </button>

    </div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyCRW0JTsN5kQ5De-MgoN8Bd6u2t2VvmLF7M",
    authDomain: "mule-learner-tuition-264fe.firebaseapp.com",
    databaseURL: "https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
    projectId: "mule-learner-tuition-264fe",
    storageBucket: "mule-learner-tuition-264fe.firebasestorage.app",
    messagingSenderId: "656883565460",
    appId: "1:656883565460:web:3aaa6a5b638a34a6d28581"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


function getLearner(){

    try{

        const current = localStorage.getItem("muleCurrentUser");

        if(!current) return null;

        return JSON.parse(current);

    }catch(error){

        console.error(error);
        return null;

    }

}


function getTime(value){

    if(value === null || value === undefined || value === "")
        return 0;

    if(typeof value === "number")
        return value;

    if(!isNaN(Number(value)) && String(value).trim() !== "")
        return Number(value);

    const date = new Date(value);

    if(isNaN(date.getTime()))
        return 0;

    return date.getTime();

}


function formatDate(value){

    const time = getTime(value);

    if(!time)
        return "Not available";

    return new Date(time).toLocaleString();

}


function remainingTime(value){

    const expiry = getTime(value);

    if(!expiry)
        return "";

    let difference = expiry - Date.now();

    if(difference <= 0)
        return "Expired";

    const hours = Math.floor(difference / (1000 * 60 * 60));

    const minutes = Math.floor(
        (difference % (1000 * 60 * 60)) /
        (1000 * 60)
    );

    if(hours > 0)
        return hours + " hour(s) " + minutes + " minute(s) remaining";

    return minutes + " minute(s) remaining";

}


function showStatus(type, icon, title, message){

    const box = document.getElementById("statusBox");

    box.className = "status " + type;

    box.innerHTML = `
        <div style="font-size:32px;">${icon}</div>
        <h3>${title}</h3>
        <p>${message}</p>
    `;

}


function showInfo(payment){

    const info = document.getElementById("paymentInfo");

    if(!payment){

        info.innerHTML = "";
        return;

    }

    info.innerHTML = `

        <div class="row">
            <span class="label">Plan</span>
            <span class="value">
                ${payment.plan || "Not specified"}
            </span>
        </div>

        <div class="row">
            <span class="label">Amount</span>
            <span class="value">
                K${payment.amount ?? 0}
            </span>
        </div>

        <div class="row">
            <span class="label">Payment Method</span>
            <span class="value">
                ${payment.method || "Not specified"}
            </span>
        </div>

        <div class="row">
            <span class="label">Submitted</span>
            <span class="value">
                ${formatDate(payment.submittedAt)}
            </span>
        </div>

        ${
            payment.approvedAt
            ?
            `
            <div class="row">
                <span class="label">Approved</span>
                <span class="value">
                    ${formatDate(payment.approvedAt)}
                </span>
            </div>
            `
            :
            ""
        }

        ${
            payment.expiresAt
            ?
            `
            <div class="row">
                <span class="label">Access</span>
                <span class="value">
                    ${remainingTime(payment.expiresAt)}
                </span>
            </div>
            `
            :
            ""
        }

        ${
            payment.rejectionReason
            ?
            `
            <div class="row">
                <span class="label">Reason</span>
                <span class="value">
                    ${payment.rejectionReason}
                </span>
            </div>
            `
            :
            ""
        }

    `;

}


async function loadPaymentStatus(){

    const learner = getLearner();

    if(!learner){

        showStatus(
            "red",
            "🔐",
            "Not Logged In",
            "Please login again."
        );

        return;

    }


    showStatus(
        "gray",
        "⏳",
        "Checking Status...",
        "Connecting to payment records."
    );


    try{

        /*
         * Read the complete payments node.
         * This avoids query problems and works with
         * both old and new payment records.
         */

        const snapshot = await get(ref(db, "payments"));


        if(!snapshot.exists()){

            showStatus(
                "gray",
                "💳",
                "No Payment Found",
                "You have not submitted a payment yet."
            );

            document.getElementById("paymentInfo").innerHTML = "";

            return;

        }


        const data = snapshot.val();

        let payments = [];


        Object.keys(data).forEach(key => {

            const payment = data[key];

            if(!payment || typeof payment !== "object")
                return;


            /*
             * Match using learner ID.
             */

            const idMatch =
                payment.learnerId &&
                learner.id &&
                String(payment.learnerId) === String(learner.id);


            /*
             * Match using learner phone.
             */

            const phoneMatch =
                payment.learnerPhone &&
                learner.phone &&
                String(payment.learnerPhone) === String(learner.phone);


            if(idMatch || phoneMatch){

                payments.push({
                    ...payment,
                    _key:key
                });

            }

        });


        if(payments.length === 0){

            showStatus(
                "gray",
                "💳",
                "No Payment Found",
                "No payment record was found for your account."
            );

            document.getElementById("paymentInfo").innerHTML = "";

            return;

        }


        /*
         * Sort newest first.
         */

        payments.sort((a,b) => {

            return getTime(b.submittedAt) -
                   getTime(a.submittedAt);

        });


        /*
         * First look for an active approved payment.
         */

        const active = payments.find(payment => {

            return payment.status === "approved" &&
                   getTime(payment.expiresAt) > Date.now();

        });


        if(active){

            if(active.isFreeTrial){

                showStatus(
                    "green",
                    "🆓",
                    "Free Trial Active",
                    "Your 6-hour free trial is active."
                );

            }else{

                showStatus(
                    "green",
                    "🟢",
                    "Payment Approved",
                    "Your learning access is active."
                );

            }

            showInfo(active);

            return;

        }


        /*
         * Check pending payments.
         */

        const pending = payments.find(payment =>
            payment.status === "pending"
        );


        if(pending){

            showStatus(
                "yellow",
                "🟡",
                "Payment Pending",
                "Your payment is waiting for CEO approval."
            );

            showInfo(pending);

            return;

        }


        /*
         * Check rejected payments.
         */

        const rejected = payments.find(payment =>
            payment.status === "rejected"
        );


        if(rejected){

            showStatus(
                "red",
                "🔴",
                "Payment Rejected",
                rejected.rejectionReason ||
                "Your payment was rejected."
            );

            showInfo(rejected);

            return;

        }


        /*
         * If there was an approved payment but it expired.
         */

        const expired = payments.find(payment =>
            payment.status === "approved"
        );


        if(expired){

            showStatus(
                "red",
                "⏱️",
                "Learning Access Expired",
                "Your previous learning access has expired."
            );

            showInfo(expired);

            return;

        }


        showStatus(
            "gray",
            "💳",
            "No Active Plan",
            "You currently have no active learning plan."
        );

        showInfo(payments[0]);


    }catch(error){

        console.error("Payment status error:", error);

        showStatus(
            "red",
            "⚠️",
            "Unable to Check Status",
            "Please check your internet connection and try again."
        );

    }

}


window.loadPaymentStatus = loadPaymentStatus;

loadPaymentStatus();

</script>

<script src="../js/app.js"></script>
<script src="../js/learner.js"></script>
<script src="../js/payments.js"></script>

</body>
</html>
