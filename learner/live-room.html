<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Live Class | Mule Learner Tuition</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:bold}
header button{border:0;background:#fff;color:#173b8f;border-radius:8px;padding:8px 12px;font-weight:bold}
main{max-width:900px;margin:auto;padding:14px}
.hero{background:#173b8f;color:white;border-radius:14px;padding:18px;margin-bottom:14px}
.hero h1{margin:0 0 5px;font-size:24px}
.card{background:white;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #00000012}
.videoBox{position:relative;background:#111;border-radius:12px;overflow:hidden}
#remoteVideo{width:100%;height:420px;object-fit:cover;background:#000}
.localVideo{position:absolute;right:12px;bottom:12px;width:125px;height:90px;object-fit:cover;border:2px solid white;border-radius:9px;background:#222}
.sound{width:100%;margin-top:10px;border:0;background:#eef3ff;color:#173b8f;padding:11px;border-radius:9px;font-weight:bold}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.controls button{border:0;padding:10px 12px;border-radius:9px;background:#eef3ff;color:#173b8f;font-weight:bold}
.controls .danger{background:#d93025;color:white}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info div{background:#f4f7fc;padding:10px;border-radius:9px}
.label{font-size:12px;color:#687386}
.value{font-weight:bold;margin-top:3px}
.chat{height:220px;overflow-y:auto;background:#f4f7fc;border-radius:10px;padding:10px}
.msg{margin-bottom:8px}
.msg b{color:#173b8f}
.chatForm{display:flex;gap:7px;margin-top:8px}
.chatForm input{flex:1;padding:11px;border:1px solid #ccd4e0;border-radius:8px}
.chatForm button{border:0;background:#173b8f;color:white;border-radius:8px;padding:10px 14px;font-weight:bold}
@media(max-width:600px){
 main{padding:10px}
 .hero h1{font-size:21px}
 #remoteVideo{height:330px}
 .localVideo{width:105px;height:78px}
}
</style>
</head>
<body>

<header>
<div class="logo">📚 Mule Learner Tuition</div>
<button onclick="location.href='../dashboard.html'">Dashboard</button>
</header>

<main>

<div class="hero">
<h1>🔴 Live Class</h1>
<div id="status">Connecting to teacher...</div>
</div>

<div class="card">
<div class="videoBox">
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" class="localVideo" autoplay muted playsinline></video>
</div>

<button class="sound" id="soundBtn">▶️ Play Teacher Sound</button>

<div class="controls">
<button id="micBtn">🎤 Mic ON</button>
<button id="cameraBtn">📷 Camera ON</button>
<button id="torchBtn">🔦 Flashlight</button>
<button class="danger" id="leaveBtn">🚪 Leave Class</button>
</div>
</div>

<div class="card">
<h3>Class Information</h3>
<div class="info">
<div><div class="label">Subject</div><div class="value" id="subject">-</div></div>
<div><div class="label">Level</div><div class="value" id="level">-</div></div>
<div><div class="label">Teacher</div><div class="value" id="teacher">-</div></div>
<div><div class="label">Participants</div><div class="value" id="participants">0</div></div>
</div>
</div>

<div class="card">
<h3>💬 Live Chat</h3>
<div class="chat" id="chat"></div>
<div class="chatForm">
<input id="chatInput" placeholder="Type a message...">
<button id="sendBtn">Send</button>
</div>
</div>

</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getDatabase,ref,get,set,update,push,onValue,onChildAdded,onDisconnect,remove}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCRUQW0JTsN5kQ5De-MgoN8Bd6u2t2vvmLF7M",
 authDomain:"mule-learner-tuition-264fe.firebaseapp.com",
 databaseURL:"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
 projectId:"mule-learner-tuition-264fe",
 storageBucket:"mule-learner-tuition-264fe.firebasestorage.app",
 messagingSenderId:"656883565460",
 appId:"1:656883565460:web:3aaa6a5b638a34a6d28581"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const $=id=>document.getElementById(id);

const session=JSON.parse(localStorage.getItem("muleCurrentUser")||"null");

if(!session||session.role!=="learner"){
 alert("Learner login required.");
 location.href="../login.html";
 throw new Error("No learner session");
}

const liveId=new URLSearchParams(location.search).get("id");

if(!liveId){
 $("status").textContent="❌ Live class ID missing.";
 throw new Error("No live ID");
}

const base="liveClasses/"+liveId;

let pc=null;
let localStream=null;
let remoteStream=new MediaStream();
let ended=false;
let remoteDescriptionReady=false;
let queuedTeacherCandidates=[];

/* STUN */
function iceServers(){
 return[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
 ];
}

/* Load live class */
async function loadClass(){

 const snap=await get(ref(db,base));

 if(!snap.exists()){
  $("status").textContent="❌ Live class not found.";
  throw new Error("Live class not found");
 }

 const c=snap.val();

 if(String(c.status||"").toLowerCase()!=="live"){
  $("status").textContent="⚫ This class is not live.";
  throw new Error("Class is not live");
 }

 $("subject").textContent=c.subject||"";
 $("level").textContent=c.level||c.grade||"";
 $("teacher").textContent=c.teacherName||"Teacher";

 await start();

 listenClass();
 listenChat();

}

/* Start learner */
async function start(){

 $("status").textContent="Starting camera...";

 try{

  localStream=await navigator.mediaDevices.getUserMedia({
   video:true,
   audio:true
  });

  $("localVideo").srcObject=localStream;

 }catch(e){

  console.error(e);

  $("status").textContent="❌ Camera/microphone permission failed.";

  alert("Please allow camera and microphone permission, then reload the page.");

  return;
 }

 const participantRef=ref(
  db,
  base+"/participants/"+session.id
 );

 await set(participantRef,{
  id:session.id,
  name:session.name||"Learner",
  role:"learner",
  joinedAt:Date.now(),
  mic:true,
  camera:true
 });

 onDisconnect(participantRef).remove();

 createPeer();

 listenOffer();
 listenTeacherCandidates();

}

/* WebRTC peer */
function createPeer(){

 pc=new RTCPeerConnection({
  iceServers:iceServers(),
  iceCandidatePoolSize:10
 });

 /* Send learner camera/mic */
 if(localStream){

  localStream.getTracks().forEach(track=>{
   pc.addTrack(track,localStream);
  });

 }else{

  pc.addTransceiver("audio",{direction:"recvonly"});
  pc.addTransceiver("video",{direction:"recvonly"});
 }

 /* Receive teacher */
 pc.ontrack=e=>{

  if(e.track&&!remoteStream.getTracks().some(t=>t.id===e.track.id)){
   remoteStream.addTrack(e.track);
  }

  $("remoteVideo").srcObject=remoteStream;

  $("remoteVideo").play().catch(()=>{});

  $("status").textContent="🟢 Connected to teacher";
 };

 pc.onconnectionstatechange=()=>{

  console.log("Learner connection:",pc.connectionState);

  if(pc.connectionState==="connected"){
   $("status").textContent="🟢 Connected to teacher";
  }

  if(pc.connectionState==="connecting"){
   $("status").textContent="Connecting to teacher...";
  }

  if(pc.connectionState==="failed"){
   $("status").textContent="❌ Connection failed. Please reload.";
  }

  if(pc.connectionState==="disconnected"){
   $("status").textContent="⚠️ Teacher connection interrupted...";
  }
 };

 /* Learner ICE */
 pc.onicecandidate=async e=>{

  if(!e.candidate)return;

  try{

   const r=push(
    ref(db,
    base+"/participants/"+session.id+"/participantCandidates")
   );

   await set(r,e.candidate.toJSON());

  }catch(err){

   console.error("Learner ICE error",err);
  }
 };

}

/* Teacher offer */
function listenOffer(){

 onValue(
  ref(db,base+"/participants/"+session.id+"/offer"),
  async snap=>{

   const offer=snap.val();

   if(!offer||!pc)return;

   try{

    if(!pc.currentRemoteDescription){

     await pc.setRemoteDescription(
      new RTCSessionDescription(offer)
     );

     remoteDescriptionReady=true;

     /* Add queued teacher ICE */
     for(const c of queuedTeacherCandidates){

      try{
       await pc.addIceCandidate(
        new RTCIceCandidate(c)
       );
      }catch(e){
       console.error(e);
      }
     }

     queuedTeacherCandidates=[];

     const answer=await pc.createAnswer();

     await pc.setLocalDescription(answer);

     await set(
      ref(db,
      base+"/participants/"+session.id+"/answer"),
      {
       type:answer.type,
       sdp:answer.sdp
      }
     );

     $("status").textContent="Connecting to teacher...";

     console.log("Answer sent to teacher");

    }

   }catch(e){

    console.error("Offer error",e);

    $("status").textContent="❌ WebRTC error.";

   }
  }
 );
}

/* Teacher ICE */
function listenTeacherCandidates(){

 onChildAdded(
  ref(db,
  base+"/participants/"+session.id+"/teacherCandidates"),
  async snap=>{

   const c=snap.val();

   if(!c||!pc)return;

   try{

    if(remoteDescriptionReady&&pc.remoteDescription){
     await pc.addIceCandidate(
      new RTCIceCandidate(c)
     );
    }else{
     queuedTeacherCandidates.push(c);
    }

   }catch(e){

    console.error("Teacher ICE error",e);
   }
  }
 );
}

/* Live class information */
function listenClass(){

 onValue(
  ref(db,base),
  snap=>{

   if(!snap.exists())return;

   const c=snap.val();

   const learners=Object.values(c.participants||{})
    .filter(p=>p&&p.role==="learner");

   /* Learners only */
   $("participants").textContent=learners.length;

   if(c.status==="ended"&&!ended){

    ended=true;

    $("status").textContent="⚫ Live class ended by teacher.";

    if(localStream){
     localStream.getTracks().forEach(t=>t.stop());
    }

    if(pc)pc.close();
   }

   if(c.status==="live"&&c.teacherOnline===false){
    $("status").textContent="⚠️ Teacher connection interrupted...";
   }

  }
 );
}

/* Sound */
$("soundBtn").onclick=async()=>{

 const video=$("remoteVideo");

 try{

  video.muted=false;
  video.volume=1;

  await video.play();

  $("soundBtn").textContent="🔊 Teacher Sound ON";

 }catch(e){

  console.error(e);
  $("soundBtn").textContent="❌ Tap again to play sound";
 }
};

/* Mic */
$("micBtn").onclick=()=>{

 if(!localStream)return;

 const track=localStream.getAudioTracks()[0];

 if(!track)return;

 track.enabled=!track.enabled;

 $("micBtn").textContent=
  track.enabled?"🎤 Mic ON":"🔇 Mic OFF";

 update(
  ref(db,base+"/participants/"+session.id),
  {mic:track.enabled}
 );
};

/* Camera */
$("cameraBtn").onclick=()=>{

 if(!localStream)return;

 const track=localStream.getVideoTracks()[0];

 if(!track)return;

 track.enabled=!track.enabled;

 $("cameraBtn").textContent=
  track.enabled?"📷 Camera ON":"📷 Camera OFF";

 update(
  ref(db,base+"/participants/"+session.id),
  {camera:track.enabled}
 );
};

/* Torch */
$("torchBtn").onclick=async()=>{

 if(!localStream)return;

 const track=localStream.getVideoTracks()[0];

 if(!track)return;

 const caps=track.getCapabilities();

 if(!caps.torch){
  alert("Flashlight is not available on this camera.");
  return;
 }

 try{

  const current=track.getSettings().torch||false;

  await track.applyConstraints({
   advanced:[{torch:!current}]
  });

 }catch(e){
  console.error(e);
 }
};

/* Leave */
$("leaveBtn").onclick=async()=>{

 if(ended)return;

 if(!confirm("Leave this live class?"))return;

 ended=true;

 try{

  if(pc)pc.close();

  if(localStream){
   localStream.getTracks().forEach(t=>t.stop());
  }

  await remove(
   ref(db,base+"/participants/"+session.id)
  );

 }catch(e){

  console.error(e);

 }

 location.href="../dashboard.html";
};

/* Chat */
function listenChat(){

 onChildAdded(
  ref(db,base+"/chat"),
  snap=>{

   const m=snap.val();

   if(!m)return;

   const div=document.createElement("div");
   div.className="msg";

   div.innerHTML=
    `<b>${escapeHTML(m.name||"User")}:</b>
     ${escapeHTML(m.message||"")}`;

   $("chat").appendChild(div);
   $("chat").scrollTop=$("chat").scrollHeight;
  }
 );
}

$("sendBtn").onclick=sendChat;

$("chatInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendChat();
});

async function sendChat(){

 const text=$("chatInput").value.trim();

 if(!text)return;

 $("chatInput").value="";

 await set(push(ref(db,base+"/chat")),{
  name:session.name||"Learner",
  userId:session.id,
  role:"learner",
  message:text,
  time:Date.now()
 });
}

function escapeHTML(s){
 return String(s)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

await loadClass();

window.addEventListener("beforeunload",()=>{
 try{
  if(localStream)localStream.getTracks().forEach(t=>t.stop());
  if(pc)pc.close();
 }catch(e){}
});
</script>

</body>
</html>
