<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Join Live Class | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fc;color:#172033;padding-bottom:25px}
header{background:#173b8f;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;font-size:15px}
.logout{background:#fff;color:#173b8f;border:0;padding:8px 12px;border-radius:7px;font-weight:bold}
.container{max-width:800px;margin:auto;padding:15px}
h2{font-size:20px;margin:8px 0 5px}
.subtitle{font-size:12px;color:#667085;margin-bottom:15px}
.card{background:#fff;border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #0001}
.status{padding:11px;border-radius:8px;background:#eef3ff;color:#173b8f;font-size:12px;margin-bottom:12px}
.live-card{border:1px solid #ffd0d0}
.live-title{font-size:15px;font-weight:bold;margin-bottom:8px}
.info{font-size:12px;color:#667085;line-height:1.7;margin-bottom:12px}
.join{display:block;width:100%;background:#168447;color:#fff;border:0;padding:11px;border-radius:8px;font-weight:bold;font-size:13px;text-align:center;text-decoration:none}
.empty{text-align:center;padding:25px 10px;color:#667085;font-size:12px}
.back{display:block;text-align:center;margin-top:15px;color:#173b8f;font-size:12px;text-decoration:none}
</style>
</head>

<body>

<header>
<div class="logo">📚 Mule Learner Tuition</div>
<button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

<h2>🔴 Join Live Class</h2>

<p class="subtitle">
Check for live lessons and join your teacher.
</p>

<div id="status" class="status">
🔄 Checking for live lessons...
</div>

<div id="liveClasses"></div>

<a href="dashboard.html" class="back">
← Back to Dashboard
</a>

</div>

<script type="module">

import{initializeApp,getApps,getApp}
from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import{getDatabase,ref,onValue}
from"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyCRUQW0JTsN5kQ5De-MgoN8Bd6u2t2vvmLF7M",
authDomain:"mule-learner-tuition-264fe.firebaseapp.com",
databaseURL:"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
projectId:"mule-learner-tuition-264fe",
storageBucket:"mule-learner-tuition-264fe.firebasestorage.app",
messagingSenderId:"656883565460",
appId:"1:656883565460:web:3aaa6a5b638a34a6d28581"
};

const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getDatabase(app);

const session=JSON.parse(
localStorage.getItem("muleCurrentUser")||"null"
);

if(!session||session.role!=="learner"){
location.href="../login.html";
throw new Error("Learner not logged in");
}

const statusBox=document.getElementById("status");
const classesBox=document.getElementById("liveClasses");

/* LIVE CLASSES + TEACHER PRESENCE */

onValue(ref(db,"liveClasses"),snapshot=>{

const data=snapshot.val()||{};
const liveClasses=[];
const now=Date.now();

/*
Teacher heartbeat runs every 15 seconds.
45 seconds gives enough tolerance for slow/mobile networks.
*/

Object.entries(data).forEach(([id,item])=>{

if(!item)return;

const isLive=
String(item.status||"").toLowerCase()==="live";

const teacherOnline=
item.teacherOnline===true;

const lastSeen=
Number(item.lastSeen||0);

const recent=
lastSeen>0 &&
(now-lastSeen)<=45000;

/* ONLY SHOW A GENUINELY ACTIVE TEACHER */

if(isLive&&teacherOnline&&recent){

liveClasses.push({
id:id,
...item
});

}

});

/* NONE LIVE */

if(!liveClasses.length){

statusBox.textContent=
"🟢 No live lessons are currently available.";

statusBox.style.background="#ecfdf3";
statusBox.style.color="#027a48";

classesBox.innerHTML=`
<div class="card empty">
🎓 No teacher is currently live.
<br><br>
Please check again later.
</div>
`;

return;

}

/* LIVE TEACHERS FOUND */

statusBox.textContent=
"🔴 "+liveClasses.length+
" live lesson"+
(liveClasses.length===1?"":"s")+
" available.";

statusBox.style.background="#fff0f0";
statusBox.style.color="#b42318";

classesBox.innerHTML="";

/* DISPLAY EACH ACTIVE TEACHER */

liveClasses.forEach(item=>{

const card=document.createElement("div");
card.className="card live-card";

const teacher=escapeHTML(
item.teacherName||item.teacher||"Teacher"
);

const subject=escapeHTML(
item.subject||"Class"
);

const level=escapeHTML(
item.level||item.grade||""
);

card.innerHTML=`

<div class="live-title">
🔴 ${teacher}
</div>

<div class="info">

<b>Subject:</b>
${subject}

<br>

<b>Level:</b>
${level}

<br>

<b>Status:</b>
🟢 Live Now

</div>

<a
class="join"
href="live-room.html?id=${encodeURIComponent(item.id)}">

🎥 JOIN ${subject.toUpperCase()}

</a>

`;

classesBox.appendChild(card);

});

},error=>{

console.error(error);

statusBox.textContent=
"⚠️ Unable to check live lessons.";

statusBox.style.background="#fee4e2";
statusBox.style.color="#b42318";

});

/* ESCAPE HTML */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* LOGOUT */

window.logout=function(){

localStorage.removeItem("muleCurrentUser");
location.href="../login.html";

};

</script>

</body>
</html>
