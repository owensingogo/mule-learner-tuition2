<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Live Class | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}
.back{background:#fff;color:#173b8f}
.container{max-width:900px;margin:auto;padding:16px}
.hero{background:#173b8f;color:#fff;border-radius:14px;padding:18px;margin-bottom:15px}
.hero h2{margin:0 0 6px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 3px 12px #0000000d}
.videoBox{background:#111;border-radius:12px;overflow:hidden;position:relative;min-height:240px}
video{width:100%;display:block;background:#111}
#remoteVideo{min-height:240px;object-fit:contain}
.label{font-size:12px;color:#777;margin:8px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.controls button{background:#173b8f;color:#fff}
.controls button.off{background:#777}
.status{padding:10px;border-radius:9px;background:#eef3ff;margin-bottom:12px}
#messages{height:180px;overflow:auto;border:1px solid #ddd;border-radius:9px;padding:9px}
.msg{padding:6px 0;border-bottom:1px solid #eee;font-size:13px}
.chat{display:flex;gap:7px;margin-top:8px}
.chat input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px}
.small{font-size:12px;color:#777}
.error{color:#b00020}
</style>
</head>

<body>

<header>
<b>🎓 Mule Learner Tuition</b>
<button class="back" onclick="location.href='dashboard.html'">Dashboard</button>
</header>

<div class="container">

<div class="hero">
<h2 id="classTitle">Live Class</h2>
<div id="classInfo">Connecting...</div>
</div>

<div class="status" id="status">Connecting to live class...</div>

<div class="card">
<div class="label">Teacher / Classroom</div>
<div class="videoBox">
<video id="remoteVideo" autoplay playsinline></video>
</div>
<div class="small" id="remoteName">Waiting for teacher...</div>
</div>

<div class="card">
<div class="label">Your Camera</div>
<div class="videoBox">
<video id="localVideo" autoplay muted playsinline></video>
</div>

<div class="controls">
<button id="micBtn" onclick="toggleMic()">🎤 Mic Off</button>
<button id="camBtn" onclick="toggleCamera()">📷 Camera Off</button>
<button onclick="leaveClass()" style="background:#b00020">Leave</button>
</div>
</div>

<div class="card">
<b>👥 Participants: <span id="count">0</span></b>
</div>

<div class="card">
<b>💬 Live Chat</b>
<div id="messages"></div>
<div class="chat">
<input id="chatInput" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>
</div>

</div>

<script type="module">
import{initializeApp}from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import{
 getDatabase,ref,get,set,update,onValue,onChildAdded,
 push,onDisconnect,remove
}from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCRUQ0WJTsN5kQ5De-MGoN8Bd6u2t2vvmLF7M",
 authDomain:"mule-learner-tuition-264fe.firebaseapp.com",
 databaseURL:"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
 projectId:"mule-learner-tuition-264fe",
 storageBucket:"mule-learner-tuition-264fe.firebasestorage.app",
 messagingSenderId:"656883565460",
 appId:"1:656883565460:web:3aaa6a5b638a34a6d28581"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const session=JSON.parse(localStorage.getItem("muleCurrentUser")||"null");

if(!session||session.role!=="learner"){
 alert("Please login as a learner.");
 location.href="../login.html";
}

const learnerId=session.id;
const liveId=new URLSearchParams(location.search).get("id");

let liveData=null;
let classData=null;
let pc=null;
let localStream=null;
let mic=false;
let camera=false;
let processedCandidates=new Set();

async function loadClass(){

 if(!liveId){
   statusText("No live class selected.");
   return;
 }

 const liveSnap=await get(ref(db,"liveClasses/"+liveId));

 if(!liveSnap.exists()){
   statusText("Live class not found.");
   return;
 }

 liveData=liveSnap.val();

 if(liveData.status!=="live"){
   statusText("This class is not currently live.");
   return;
 }

 const classId=liveData.classId||liveId;
 const classSnap=await get(ref(db,"classes/"+classId));

 if(classSnap.exists()) classData=classSnap.val();

 document.getElementById("classTitle").textContent=
   liveData.title||classData?.className||"Live Class";

 document.getElementById("classInfo").textContent=
   (liveData.subject||classData?.subject||"")+
   " • "+
   (liveData.level||classData?.level||classData?.grade||"");

 await joinWebRTC();
 listenChat();
 listenParticipants();
}

function statusText(t){
 document.getElementById("status").textContent=t;
}

async function joinWebRTC(){

 const participantRef=
   ref(db,`liveClasses/${liveId}/participants/${learnerId}`);

 await set(participantRef,{
   id:learnerId,
   name:session.name||"Learner",
   role:"learner",
   mic:false,
   camera:false,
   joinedAt:Date.now()
 });

 onDisconnect(participantRef).remove();

 try{
   localStream=await navigator.mediaDevices.getUserMedia({
     video:true,
     audio:true
   });

   localStream.getVideoTracks().forEach(t=>t.enabled=false);
   localStream.getAudioTracks().forEach(t=>t.enabled=false);

   document.getElementById("localVideo").srcObject=localStream;
 }catch(e){
   console.log("Media permission:",e);
 }

 pc=new RTCPeerConnection({
   iceServers:[
     {urls:"stun:stun.l.google.com:19302"},
     {urls:"stun:stun1.l.google.com:19302"}
   ]
 });

 if(localStream){
   localStream.getTracks().forEach(track=>{
     pc.addTrack(track,localStream);
   });
 }

 pc.ontrack=e=>{
   if(e.streams[0]){
     document.getElementById("remoteVideo").srcObject=e.streams[0];
     document.getElementById("remoteName").textContent=
       "🔴 Teacher is connected";
   }
 };

 pc.onicecandidate=e=>{
   if(e.candidate){
     const key=push(ref(db,
       `liveClasses/${liveId}/participants/${learnerId}/participantCandidates`
     )).key;

     set(ref(db,
       `liveClasses/${liveId}/participants/${learnerId}/participantCandidates/${key}`
     ),e.candidate.toJSON());
   }
 };

 onValue(ref(db,
   `liveClasses/${liveId}/participants/${learnerId}/offer`
 ),async snap=>{

   if(!snap.exists())return;

   const offer=snap.val();

   if(pc.currentRemoteDescription)return;

   await pc.setRemoteDescription(offer);

   const answer=await pc.createAnswer();

   await pc.setLocalDescription(answer);

   await set(ref(db,
     `liveClasses/${liveId}/participants/${learnerId}/answer`
   ),{
     type:answer.type,
     sdp:answer.sdp
   });

   statusText("🟢 Connected to teacher");
 });

 onChildAdded(ref(db,
   `liveClasses/${liveId}/participants/${learnerId}/teacherCandidates`
 ),async snap=>{

   if(processedCandidates.has(snap.key))return;
   processedCandidates.add(snap.key);

   try{
     await pc.addIceCandidate(snap.val());
   }catch(e){}
 });

 statusText("Waiting for teacher...");
 await notifyJoined();
}

async function notifyJoined(){

 const id="NOT-"+Date.now()+"-"+Math.random()
 .toString(36).substring(2,7).toUpperCase();

 await set(ref(db,"notifications/"+id),{
   id,
   type:"live_class_join",
   title:"👨‍🎓 Learner Joined Live Class",
   message:(session.name||"Learner")+
     " has joined "+(liveData.title||"a live class")+".",
   learnerId,
   learnerName:session.name||"Learner",
   learnerPhone:session.phone||"",
   classId:liveData.classId||liveId,
   liveClassId:liveId,
   subject:liveData.subject||"",
   read:false,
   createdAt:new Date().toISOString(),
   createdBy:"Learner Live Class"
 });
}

function listenParticipants(){

 onValue(ref(db,`liveClasses/${liveId}/participants`),snap=>{
   let n=0;

   snap.forEach(x=>{
     if(x.val()?.role)n++;
   });

   document.getElementById("count").textContent=n;
 });
}

window.toggleMic=async function(){

 if(!localStream)return;

 mic=!mic;

 localStream.getAudioTracks().forEach(t=>t.enabled=mic);

 await update(ref(db,
   `liveClasses/${liveId}/participants/${learnerId}`
 ),{mic});

 document.getElementById("micBtn").textContent=
   mic?"🎤 Mic On":"🎤 Mic Off";
};

window.toggleCamera=async function(){

 if(!localStream)return;

 camera=!camera;

 localStream.getVideoTracks().forEach(t=>t.enabled=camera);

 await update(ref(db,
   `liveClasses/${liveId}/participants/${learnerId}`
 ),{camera});

 document.getElementById("camBtn").textContent=
   camera?"📷 Camera On":"📷 Camera Off";
};

function listenChat(){

 onChildAdded(ref(db,`liveClasses/${liveId}/chat`),snap=>{
   const m=snap.val();
   const div=document.createElement("div");
   div.className="msg";
   div.textContent=(m.name||"User")+": "+(m.message||"");
   document.getElementById("messages").appendChild(div);

   const box=document.getElementById("messages");
   box.scrollTop=box.scrollHeight;
 });
}

window.sendMessage=async function(){

 const input=document.getElementById("chatInput");
 const message=input.value.trim();

 if(!message)return;

 const key=push(ref(db,`liveClasses/${liveId}/chat`)).key;

 await set(ref(db,`liveClasses/${liveId}/chat/${key}`),{
   name:session.name||"Learner",
   role:"learner",
   message,
   createdAt:Date.now()
 });

 input.value="";
};

window.leaveClass=async function(){

 try{
   if(pc)pc.close();

   if(localStream)
     localStream.getTracks().forEach(t=>t.stop());

   await remove(ref(db,
     `liveClasses/${liveId}/participants/${learnerId}`
   ));
 }catch(e){}

 location.href="dashboard.html";
};

loadClass().catch(e=>{
 console.error(e);
 statusText("Unable to connect to live class.");
});
</script>

</body>
</html>
