<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Live Class | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}
.back{background:#fff;color:#173b8f}
.container{max-width:900px;margin:auto;padding:16px}
.hero{background:#173b8f;color:#fff;border-radius:14px;padding:18px;margin-bottom:15px}
.hero h2{margin:0 0 6px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 3px 12px #0000000d}
.videoBox{background:#111;border-radius:12px;overflow:hidden;min-height:240px}
video{width:100%;display:block;background:#111}
#remoteVideo{min-height:240px;object-fit:contain}
.label{font-size:12px;color:#777;margin:8px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.controls button{background:#173b8f;color:#fff}
.status{padding:10px;border-radius:9px;background:#eef3ff;margin-bottom:12px}
#messages{height:180px;overflow:auto;border:1px solid #ddd;border-radius:9px;padding:9px}
.msg{padding:6px 0;border-bottom:1px solid #eee;font-size:13px}
.chat{display:flex;gap:7px;margin-top:8px}
.chat input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px}
.small{font-size:12px;color:#777}
.soundBtn{background:#0b7a3b!important}
.leaveBtn{background:#b00020!important}
</style>
</head>

<body>

<header>
<b>🎓 Mule Learner Tuition</b>
<button class="back" onclick="location.href='dashboard.html'">Dashboard</button>
</header>

<div class="container">

<div class="hero">
<h2 id="classTitle">Live Class</h2>
<div id="classInfo">Connecting...</div>
</div>

<div class="status" id="status">
Connecting to teacher...
</div>

<div class="card">

<div class="label">👨‍🏫 Teacher / Classroom</div>

<div class="videoBox">
<video id="remoteVideo"
       autoplay
       playsinline
       controls>
</video>
</div>

<div class="controls">
<button id="soundBtn"
        class="soundBtn"
        onclick="enableSound()">
🔊 Enable Sound
</button>
</div>

<div class="small" id="remoteName">
Waiting for teacher...
</div>

</div>

<div class="card">

<div class="label">Your Camera</div>

<div class="videoBox">
<video id="localVideo"
       autoplay
       muted
       playsinline></video>
</div>

<div class="controls">
<button id="micBtn"
        onclick="toggleMic()">
🎤 Mic Off
</button>

<button id="camBtn"
        onclick="toggleCamera()">
📷 Camera Off
</button>

<button id="torchBtn"
        onclick="toggleTorch()">
🔦 Flashlight
</button>

<button class="leaveBtn"
        onclick="leaveClass()">
Leave
</button>
</div>

</div>

<div class="card">
<b>👥 Participants: <span id="count">0</span></b>
</div>

<div class="card">

<b>💬 Live Chat</b>

<div id="messages"></div>

<div class="chat">
<input id="chatInput"
       placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

</div>

<script type="module">

import{initializeApp}from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import{
 getDatabase,ref,get,set,update,onValue,onChildAdded,
 push,onDisconnect,remove
}from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCRUQ0WJTsN5kQ5De-MgoN8Bd6u2t2vvmLF7M",
 authDomain:"mule-learner-tuition-264fe.firebaseapp.com",
 databaseURL:"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
 projectId:"mule-learner-tuition-264fe",
 storageBucket:"mule-learner-tuition-264fe.firebasestorage.app",
 messagingSenderId:"656883565460",
 appId:"1:656883565460:web:3aaa6a5b638a34a6d28581"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const session=JSON.parse(
 localStorage.getItem("muleCurrentUser")||"null"
);

if(!session||session.role!=="learner"){
 alert("Please login as a learner.");
 location.href="../login.html";
 throw new Error("Learner login required");
}

const learnerId=session.id;

const liveId=
 new URLSearchParams(location.search).get("id");

let liveData=null;
let classData=null;
let pc=null;
let localStream=null;

let mic=false;
let camera=false;
let torch=false;

let remoteDescriptionReady=false;
let candidateQueue=[];

function statusText(text){
 document.getElementById("status").textContent=text;
}

async function loadClass(){

 if(!liveId){
   statusText("❌ No live class selected.");
   return;
 }

 const liveSnap=
   await get(ref(db,"liveClasses/"+liveId));

 if(!liveSnap.exists()){
   statusText("❌ Live class not found.");
   return;
 }

 liveData=liveSnap.val();

 if(liveData.status!=="live"){
   statusText("This class is not currently live.");
   return;
 }

 const classId=
   liveData.classId||liveId;

 const classSnap=
   await get(ref(db,"classes/"+classId));

 if(classSnap.exists()){
   classData=classSnap.val();
 }

 document.getElementById("classTitle")
  .textContent=
   liveData.title||
   classData?.className||
   "Live Class";

 document.getElementById("classInfo")
  .textContent=
   (liveData.subject||
    classData?.subject||
    "")+
   " • "+
   (liveData.level||
    classData?.level||
    classData?.grade||
    "");

 await joinWebRTC();

 listenChat();
 listenParticipants();
}

/* =========================
   WEBRTC
========================= */

async function joinWebRTC(){

 const participantRef=
   ref(db,
   `liveClasses/${liveId}/participants/${learnerId}`);

 /*
   IMPORTANT:
   Create a fresh joinedAt value so the teacher
   knows this is a new connection.
 */
 const joinedAt=Date.now();

 await set(participantRef,{
   id:learnerId,
   name:session.name||"Learner",
   role:"learner",
   mic:false,
   camera:false,
   joinedAt
 });

 onDisconnect(participantRef).remove();

 /*
   Try to obtain camera/microphone.
   Even if this fails, the learner can still
   receive the teacher's media.
 */
 try{

   localStream=
     await navigator.mediaDevices.getUserMedia({
       video:{
         facingMode:"user",
         width:{ideal:1280},
         height:{ideal:720}
       },
       audio:{
         echoCancellation:true,
         noiseSuppression:true,
         autoGainControl:true
       }
     });

   localStream.getVideoTracks()
    .forEach(t=>t.enabled=false);

   localStream.getAudioTracks()
    .forEach(t=>t.enabled=false);

   document.getElementById("localVideo")
    .srcObject=localStream;

 }catch(error){

   console.log(
     "Learner camera/mic unavailable:",
     error
   );
 }

 pc=new RTCPeerConnection({
   iceServers:[
     {urls:"stun:stun.l.google.com:19302"},
     {urls:"stun:stun1.l.google.com:19302"}
   ],
   iceCandidatePoolSize:10
 });

 /*
   If local media exists, add it.
   If it doesn't exist, explicitly create
   receive-only transceivers so the learner
   can still receive teacher audio/video.
 */
 if(localStream){

   localStream.getTracks()
    .forEach(track=>{
      pc.addTrack(track,localStream);
    });

 }else{

   pc.addTransceiver(
     "audio",
     {direction:"recvonly"}
   );

   pc.addTransceiver(
     "video",
     {direction:"recvonly"}
   );
 }

 pc.onconnectionstatechange=()=>{

   console.log(
     "Learner connection:",
     pc.connectionState
   );

   if(pc.connectionState==="connected"){

     statusText(
       "🟢 Connected — teacher video/audio link active."
     );

   }else if(pc.connectionState==="connecting"){

     statusText(
       "🟡 Connecting teacher media..."
     );

   }else if(
     pc.connectionState==="failed"
   ){

     statusText(
       "🔴 WebRTC media connection failed."
     );

   }else if(
     pc.connectionState==="disconnected"
   ){

     statusText(
       "🟠 Teacher media temporarily disconnected."
     );
   }
 };

 pc.oniceconnectionstatechange=()=>{

   console.log(
     "Learner ICE:",
     pc.iceConnectionState
   );
 };

 /*
   Receive teacher tracks.
 */
 pc.ontrack=e=>{

   console.log(
     "Teacher track received:",
     e.track.kind
   );

   const video=
     document.getElementById("remoteVideo");

   let stream=video.srcObject;

   if(!stream){

     stream=new MediaStream();

     video.srcObject=stream;
   }

   if(
     e.track &&
     !stream.getTracks().includes(e.track)
   ){

     stream.addTrack(e.track);
   }

   document.getElementById("remoteName")
    .textContent=
     "🔴 Teacher is connected";

   statusText(
     "🟢 Teacher media received."
   );

   video.play().catch(()=>{

     statusText(
       "🟢 Teacher connected. Tap 🔊 Enable Sound."
     );
   });
 };

 /*
   Send learner ICE candidates to teacher.
 */
 pc.onicecandidate=e=>{

   if(!e.candidate)return;

   const key=
     push(ref(db,
     `liveClasses/${liveId}/participants/${learnerId}/participantCandidates`
     )).key;

   set(ref(db,
     `liveClasses/${liveId}/participants/${learnerId}/participantCandidates/${key}`
   ),e.candidate.toJSON())
   .catch(console.error);
 };

 /*
   Listen for teacher offer.
 */
 onValue(
   ref(db,
   `liveClasses/${liveId}/participants/${learnerId}/offer`),
   async snap=>{

     if(!snap.exists())return;

     const offer=snap.val();

     try{

       /*
         Ignore the same offer once already negotiated.
       */
       if(
         pc.currentRemoteDescription
       ){

         return;
       }

       await pc.setRemoteDescription(
         offer
       );

       remoteDescriptionReady=true;

       await flushCandidates();

       const answer=
         await pc.createAnswer();

       await pc.setLocalDescription(
         answer
       );

       await set(ref(db,
         `liveClasses/${liveId}/participants/${learnerId}/answer`
       ),{
         type:pc.localDescription.type,
         sdp:pc.localDescription.sdp,
         createdAt:Date.now()
       });

       statusText(
         "🟡 Teacher offer received. Connecting media..."
       );

     }catch(error){

       console.error(
         "Learner offer error:",
         error
       );

       statusText(
         "❌ WebRTC negotiation failed."
       );
     }
   }
 );

 /*
   Receive teacher ICE candidates.
 */
 onChildAdded(
   ref(db,
   `liveClasses/${liveId}/participants/${learnerId}/teacherCandidates`
   ),
   async snap=>{

     const candidate=snap.val();

     if(!candidate)return;

     if(remoteDescriptionReady){

       try{

         await pc.addIceCandidate(
           candidate
         );

       }catch(error){

         console.log(
           "Teacher ICE error:",
           error
         );
       }

     }else{

       candidateQueue.push(candidate);
     }
   }
 );

 statusText(
   "🟡 Waiting for teacher media..."
 );

 await notifyJoined();
}

async function flushCandidates(){

 if(!pc||!remoteDescriptionReady)return;

 const queue=[...candidateQueue];

 candidateQueue=[];

 for(
   const candidate of queue
 ){

   try{

     await pc.addIceCandidate(
       candidate
     );

   }catch(error){

     console.log(
       "Queued ICE error:",
       error
     );
   }
 }
}

/* =========================
   ENABLE SOUND
========================= */

window.enableSound=async function(){

 const video=
   document.getElementById("remoteVideo");

 try{

   video.muted=false;

   await video.play();

   document.getElementById("soundBtn")
    .textContent=
     "🔊 Sound Enabled";

   statusText(
     "🟢 Teacher video and sound enabled."
   );

 }catch(error){

   console.log(
     "Sound error:",
     error
   );

   alert(
     "Tap the teacher video once to enable sound."
   );
 }
};

/* =========================
   TORCH
========================= */

window.toggleTorch=async function(){

 if(!localStream){

   alert("Camera is not available.");
   return;
 }

 const track=
   localStream.getVideoTracks()[0];

 if(!track){

   alert("Camera is not available.");
   return;
 }

 const capabilities=
   track.getCapabilities?
   track.getCapabilities():{};

 if(!capabilities.torch){

   alert(
     "🔦 Flashlight is not supported by this camera/browser."
   );

   return;
 }

 torch=!torch;

 try{

   await track.applyConstraints({
     advanced:[{torch}]
   });

   document.getElementById("torchBtn")
    .textContent=
     torch?
     "🔦 Flashlight On":
     "🔦 Flashlight";

 }catch(error){

   torch=!torch;

   alert(
     "Unable to control the flashlight."
   );
 }
};

/* =========================
   MIC
========================= */

window.toggleMic=async function(){

 if(!localStream)return;

 mic=!mic;

 localStream.getAudioTracks()
  .forEach(t=>t.enabled=mic);

 document.getElementById("micBtn")
  .textContent=
   mic?
   "🎤 Mic On":
   "🎤 Mic Off";

 await update(ref(db,
   `liveClasses/${liveId}/participants/${learnerId}`
 ),{mic});
};

/* =========================
   CAMERA
========================= */

window.toggleCamera=async function(){

 if(!localStream)return;

 camera=!camera;

 localStream.getVideoTracks()
  .forEach(t=>t.enabled=camera);

 document.getElementById("camBtn")
  .textContent=
   camera?
   "📷 Camera On":
   "📷 Camera Off";

 await update(ref(db,
   `liveClasses/${liveId}/participants/${learnerId}`
 ),{camera});
};

/* =========================
   NOTIFICATION
========================= */

async function notifyJoined(){

 try{

   const id=
     "NOT-"+Date.now()+"-"+Math.random()
      .toString(36)
      .substring(2,7)
      .toUpperCase();

   await set(ref(db,
     "notifications/"+id),{
       id,
       type:"live_class_join",
       title:"👨‍🎓 Learner Joined Live Class",
       message:
         (session.name||"Learner")+
         " has joined "+
         (liveData.title||"a live class")+".",
       learnerId,
       learnerName:
         session.name||"Learner",
       learnerPhone:
         session.phone||"",
       classId:
         liveData.classId||liveId,
       liveClassId:liveId,
       subject:
         liveData.subject||"",
       read:false,
       createdAt:
         new Date().toISOString(),
       createdBy:
         "Learner Live Class"
   });

 }catch(error){

   console.log(
     "Notification error:",
     error
   );
 }
}

/* =========================
   PARTICIPANTS
========================= */

function listenParticipants(){

 onValue(
   ref(db,
   `liveClasses/${liveId}/participants`),
   snap=>{

     let count=0;

     snap.forEach(child=>{

       if(child.val()?.role){
         count++;
       }
     });

     document.getElementById("count")
      .textContent=count;
   }
 );
}

/* =========================
   CHAT
========================= */

function listenChat(){

 onChildAdded(
   ref(db,
   `liveClasses/${liveId}/chat`),
   snap=>{

     const m=snap.val();

     const div=
       document.createElement("div");

     div.className="msg";

     div.textContent=
       (m.name||"User")+
       ": "+
       (m.message||"");

     document.getElementById("messages")
      .appendChild(div);

     const box=
       document.getElementById("messages");

     box.scrollTop=
       box.scrollHeight;
   }
 );
}

window.sendMessage=async function(){

 const input=
   document.getElementById("chatInput");

 const message=
   input.value.trim();

 if(!message)return;

 const key=
   push(ref(db,
   `liveClasses/${liveId}/chat`
   )).key;

 await set(ref(db,
   `liveClasses/${liveId}/chat/${key}`
 ),{
   name:session.name||"Learner",
   role:"learner",
   message,
   createdAt:Date.now()
 });

 input.value="";
};

/* =========================
   LEAVE
========================= */

window.leaveClass=async function(){

 try{

   if(pc){

     pc.close();
     pc=null;
   }

   if(localStream){

     localStream.getTracks()
      .forEach(t=>t.stop());
   }

   await remove(ref(db,
     `liveClasses/${liveId}/participants/${learnerId}`
   ));

 }catch(error){

   console.log(error);
 }

 location.href="dashboard.html";
};

loadClass().catch(error=>{

 console.error(error);

 statusText(
   "❌ Unable to connect to live class."
 );
});

</script>

</body>
</html>
