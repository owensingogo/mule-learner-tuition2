<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173b8f">

<title>My Learners | Mule Learner Tuition</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fc;
  color:#172033;
  min-height:100vh;
}

.header{
  background:#173b8f;
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:20px;
  cursor:pointer;
}

.header-text h1{
  font-size:20px;
  margin-bottom:3px;
}

.header-text p{
  font-size:12px;
  opacity:.85;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:16px;
}

.summary{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.summary-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.summary-icon{
  width:45px;
  height:45px;
  border-radius:12px;
  background:#eaf0ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.summary h2{
  font-size:16px;
}

.summary p{
  font-size:12px;
  color:#667085;
  margin-top:3px;
}

.count{
  font-size:24px;
  font-weight:bold;
  color:#173b8f;
}

.search-box{
  margin-bottom:14px;
}

.search-box input{
  width:100%;
  padding:13px 15px;
  border:1px solid #d9deea;
  border-radius:12px;
  outline:none;
  font-size:14px;
  background:white;
}

.search-box input:focus{
  border-color:#173b8f;
}

#learnersList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.learner-card{
  background:white;
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  border:1px solid #edf0f6;
}

.learner-icon{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  background:#eaf0ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.learner-info{
  flex:1;
  min-width:0;
}

.learner-info h3{
  font-size:15px;
  margin-bottom:5px;
  color:#172033;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.learner-info p{
  font-size:12px;
  color:#667085;
  margin:2px 0;
}

.status{
  font-size:10px;
  padding:5px 8px;
  border-radius:20px;
  background:#e8f7ed;
  color:#16833a;
  font-weight:bold;
}

.loading{
  background:white;
  border-radius:14px;
  padding:25px;
  text-align:center;
  color:#667085;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.spinner{
  width:25px;
  height:25px;
  border:3px solid #e2e7f0;
  border-top-color:#173b8f;
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 10px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.empty{
  background:white;
  border-radius:14px;
  padding:30px 20px;
  text-align:center;
  color:#667085;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

.error{
  background:#fff0f0;
  color:#c62828;
  border-radius:14px;
  padding:18px;
  text-align:center;
}

.refresh{
  border:0;
  background:#173b8f;
  color:white;
  padding:9px 13px;
  border-radius:9px;
  font-size:12px;
  cursor:pointer;
}

@media(max-width:420px){
  .container{
    padding:12px;
  }

  .header{
    padding:13px;
  }

  .header-text h1{
    font-size:18px;
  }

  .summary{
    padding:13px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-row">

    <button class="back" onclick="goBack()">‹</button>

    <div class="header-text">
      <h1>👥 My Learners</h1>
      <p>View all learners registered on Mule Learner Tuition</p>
    </div>

  </div>
</header>

<main class="container">

  <div class="summary">

    <div class="summary-left">

      <div class="summary-icon">
        👥
      </div>

      <div>
        <h2>All Learners</h2>
        <p>All learners in the database</p>
      </div>

    </div>

    <div class="count" id="learnerCount">
      0
    </div>

  </div>

  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="🔍 Search learner..."
      autocomplete="off"
    >
  </div>

  <div id="learnersList">

    <div class="loading">
      <div class="spinner"></div>
      Loading learners...
    </div>

  </div>

</main>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================================
   YOUR FIREBASE CONFIGURATION
   USE THE SAME CONFIG AS YOUR OTHER PAGES
========================================= */

const firebaseConfig = {

  apiKey: "YOUR_API_KEY",

  authDomain: "YOUR_PROJECT.firebaseapp.com",

  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

  projectId: "YOUR_PROJECT",

  storageBucket: "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

  appId: "YOUR_APP_ID"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =========================================
   ELEMENTS
========================================= */

const learnersList =
  document.getElementById("learnersList");

const learnerCount =
  document.getElementById("learnerCount");

const searchInput =
  document.getElementById("searchInput");


/* =========================================
   STORE LEARNERS LOCALLY
   FOR FAST SEARCH
========================================= */

let allLearners = [];


/* =========================================
   LOAD ALL LEARNERS
========================================= */

function loadAllLearners(){

  learnersList.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Loading learners...
    </div>
  `;


  /*
    IMPORTANT:

    We read:

        learners

    directly.

    There is NO teacherId filter.
    There is NO assignedTeacher filter.

    Therefore every learner stored under
    /learners can be displayed.
  */

  const learnersRef = ref(db,"learners");


  /*
    onValue keeps the page updated automatically.

    When a learner registers,
    the teacher page can receive the
    new learner without manually
    assigning them.
  */

  onValue(
    learnersRef,

    (snapshot)=>{

      if(!snapshot.exists()){

        allLearners = [];

        learnerCount.textContent = "0";

        learnersList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              👥
            </div>

            <h3>No Learners Found</h3>

            <p>
              There are currently no learners
              registered in the database.
            </p>

          </div>
        `;

        return;
      }


      const data = snapshot.val();


      allLearners = Object.entries(data).map(
        ([id,learner])=>({

          id:id,

          ...learner

        })
      );


      /*
        Show total number
      */

      learnerCount.textContent =
        allLearners.length;


      /*
        Display immediately
      */

      displayLearners(allLearners);

    },

    (error)=>{

      console.error(
        "Firebase error:",
        error
      );

      learnersList.innerHTML = `
        <div class="error">

          ❌ Unable to load learners.

          <br><br>

          Please check your internet
          connection and try again.

        </div>
      `;

    }
  );

}


/* =========================================
   DISPLAY LEARNERS
========================================= */

function displayLearners(learners){

  if(!learners.length){

    learnersList.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          🔍
        </div>

        <h3>No Learners Found</h3>

        <p>
          No learner matches your search.
        </p>

      </div>
    `;

    return;
  }


  let html = "";


  learners.forEach((learner)=>{

    /*
      Support different names used
      in your Firebase registration.
    */

    const name =
      learner.name ||
      learner.fullName ||
      learner.username ||
      "Unnamed Learner";


    const phone =
      learner.phone ||
      learner.phoneNumber ||
      learner.mobile ||
      "No phone number";


    const grade =
      learner.grade ||
      learner.class ||
      learner.level ||
      "Not specified";


    const status =
      learner.status ||
      learner.accountStatus ||
      "Active";


    html += `

      <div class="learner-card">

        <div class="learner-icon">
          👤
        </div>

        <div class="learner-info">

          <h3>
            ${escapeHTML(name)}
          </h3>

          <p>
            📱 ${escapeHTML(phone)}
          </p>

          <p>
            🎓 ${escapeHTML(grade)}
          </p>

        </div>

        <div>
          <span class="status">
            ${escapeHTML(status)}
          </span>
        </div>

      </div>

    `;

  });


  learnersList.innerHTML = html;

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  function(){

    const search =
      this.value
      .toLowerCase()
      .trim();


    if(!search){

      displayLearners(allLearners);

      return;

    }


    const filtered =
      allLearners.filter((learner)=>{

        const name =
          String(
            learner.name ||
            learner.fullName ||
            learner.username ||
            ""
          ).toLowerCase();


        const phone =
          String(
            learner.phone ||
            learner.phoneNumber ||
            learner.mobile ||
            ""
          ).toLowerCase();


        const grade =
          String(
            learner.grade ||
            learner.class ||
            learner.level ||
            ""
          ).toLowerCase();


        return (

          name.includes(search) ||

          phone.includes(search) ||

          grade.includes(search)

        );

      });


    displayLearners(filtered);

  }
);


/* =========================================
   SECURITY
   PREVENT HTML INJECTION
========================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================================
   BACK BUTTON
========================================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer !== location.href
  ){

    history.back();

  }else{

    window.location.href =
      "dashboard.html";

  }

}


/* =========================================
   START IMMEDIATELY
========================================= */

loadAllLearners();

</script>

</body>
</html>
