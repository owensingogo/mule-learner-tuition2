<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#173b8f">
<title>Live Class | Mule Learner Tuition</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;font-size:18px}
header button{border:0;background:#fff;color:#173b8f;padding:8px 12px;border-radius:8px;font-weight:bold}
.container{max-width:900px;margin:auto;padding:14px}
.hero{background:#173b8f;color:#fff;border-radius:14px;padding:18px;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:24px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.status{font-weight:bold;color:#173b8f}
.videoBox{position:relative;background:#000;border-radius:12px;overflow:hidden}
#localVideo{width:100%;height:400px;object-fit:cover;background:#111}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.controls button{border:0;padding:11px 12px;border-radius:9px;background:#173b8f;color:#fff;font-weight:bold}
.controls button.danger{background:#d62828}
#learners{display:flex;gap:8px;overflow-x:auto}
.learner{min-width:100px;background:#eef3ff;border-radius:10px;padding:8px;text-align:center}
.learner video{width:84px;height:65px;object-fit:cover;border-radius:7px;background:#000}
.chat{height:230px;overflow-y:auto;background:#f5f7fb;border-radius:10px;padding:10px}
.msg{margin-bottom:8px}
.msg b{color:#173b8f}
.chatbar{display:flex;gap:6px;margin-top:8px}
.chatbar input{flex:1;padding:11px;border:1px solid #ccd3df;border-radius:8px}
.chatbar button{border:0;background:#173b8f;color:#fff;border-radius:8px;padding:10px 14px}
.info{line-height:1.7}
@media(max-width:600px){
 #localVideo{height:280px}
 .container{padding:10px}
}
</style>
</head>
<body>

<header>
<div class="logo">📚 Mule Learner Tuition</div>
<button onclick="location.href='../dashboard.html'">Dashboard</button>
</header>

<div class="container">

<div class="hero">
<h1>🔴 Live Class</h1>
<div id="status">Connecting...</div>
</div>

<div class="card">
<div id="learners"></div>
</div>

<div class="card">
<div class="videoBox">
<video id="localVideo" autoplay muted playsinline></video>
</div>

<div class="controls">
<button id="micBtn">🎤 Mic On</button>
<button id="cameraBtn">📷 Camera On</button>
<button id="switchBtn">🔄 Camera</button>
<button id="torchBtn">🔦 Torch</button>
<button class="danger" id="endBtn">⛔ End Class</button>
</div>
</div>

<div class="card info">
<b>Class Information</b><br>
Subject: <span id="subject">—</span><br>
Level: <span id="level">—</span><br>
Teacher: <span id="teacher">—</span><br>
Participants: <span id="participantCount">0</span>
</div>

<div class="card">
<b>💬 Live Chat</b>
<div id="chat" class="chat"></div>
<div class="chatbar">
<input id="chatInput" placeholder="Type a message...">
<button id="sendBtn">Send</button>
</div>
</div>

</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getDatabase,ref,get,set,update,push,onValue,onChildAdded,onDisconnect,remove}
from"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyCRUQW0JTsN5kQ5De-MgoN8Bd6u2t2vvmLF7M",
authDomain:"mule-learner-tuition-264fe.firebaseapp.com",
databaseURL:"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
projectId:"mule-learner-tuition-264fe",
storageBucket:"mule-learner-tuition-264fe.firebasestorage.app",
messagingSenderId:"656883565460",
appId:"1:656883565460:web:3aaa6a5b638a34a6d28581"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const $=id=>document.getElementById(id);

const statusEl=$("status");
const localVideo=$("localVideo");
const participantCount=$("participantCount");
const learnersBox=$("learners");
const subjectEl=$("subject");
const levelEl=$("level");
const teacherEl=$("teacher");
const chatBox=$("chat");
const chatInput=$("chatInput");

const session=JSON.parse(localStorage.getItem("muleCurrentUser")||"null");

if(!session||session.role!=="teacher"){
location.href="../login.html";
}

const classId=new URLSearchParams(location.search).get("id");

if(!classId){
statusEl.textContent="❌ No class selected";
throw new Error("Missing class ID");
}

let liveId=classId;
let liveRef;
let partRef;
let localStream=null;
let currentFacing="user";
let peers={};
let heartbeat=null;
let started=false;

const rtcConfig={
iceServers:[
{urls:"stun:stun.l.google.com:19302"},
{urls:"stun:stun1.l.google.com:19302"}
],
iceCandidatePoolSize:10
};

function now(){return Date.now()}

function setStatus(x){
statusEl.textContent=x;
console.log(x);
}

async function loadClass(){

try{

setStatus("Loading class...");

const snap=await get(ref(db,"classes/"+classId));

if(snap.exists()){

const c=snap.val();

liveId=c.liveClassId||classId;

subjectEl.textContent=c.subject||"";
levelEl.textContent=c.level||c.grade||"";
teacherEl.textContent=session.name||"Teacher";

}else{

teacherEl.textContent=session.name||"Teacher";

}

liveRef=ref(db,"liveClasses/"+liveId);
partRef=ref(db,"liveClasses/"+liveId+"/participants");

await startClass();

}catch(e){

console.error(e);
setStatus("❌ Error: "+(e.message||e));

}

}

async function startCamera(){

try{

setStatus("Starting camera...");

localStream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:currentFacing},
audio:true
});

localVideo.srcObject=localStream;

return true;

}catch(e){

console.error(e);
setStatus("❌ Camera/Microphone error");

return false;

}

}

async function startClass(){

if(started)return;
started=true;

await startCamera();

setStatus("Starting live class...");

const data={
id:liveId,
classId:classId,
status:"live",
teacherId:session.id,
teacherName:session.name||"Teacher",
subject:subjectEl.textContent||"",
level:levelEl.textContent||"",
grade:levelEl.textContent||"",
startedAt:now(),
teacherOnline:true,
lastSeen:now()
};

await update(liveRef,data);

const teacherPart=ref(db,"liveClasses/"+liveId+"/participants/"+session.id);

await set(teacherPart,{
id:session.id,
name:session.name||"Teacher",
role:"teacher",
joinedAt:now()
});

await onDisconnect(teacherPart).remove();

await onDisconnect(ref(db,"liveClasses/"+liveId+"/teacherOnline")).set(false);
await onDisconnect(ref(db,"liveClasses/"+liveId+"/lastSeen")).set(0);

heartbeat=setInterval(async()=>{
try{
await update(liveRef,{
teacherOnline:true,
lastSeen:now(),
status:"live"
});
}catch(e){}
},15000);

setStatus("🟢 Live — waiting for learners...");

listenParticipants();
listenChat();

}

function listenParticipants(){

onValue(partRef,snap=>{

const data=snap.val()||{};
const ids=Object.keys(data);

const learners=ids.filter(id=>id!==session.id);

participantCount.textContent=learners.length;

learnersBox.innerHTML="";

learners.forEach(id=>{

const p=data[id]||{};

const box=document.createElement("div");
box.className="learner";
box.id="learner-"+id;

box.innerHTML=`
<video id="video-${id}" autoplay playsinline></video>
<div>${p.name||"Learner"}</div>
`;

learnersBox.appendChild(box);

if(!peers[id]){
createPeer(id);
}

});

Object.keys(peers).forEach(id=>{
if(!data[id]&&id!==session.id){
try{peers[id].pc.close()}catch(e){}
delete peers[id];
}
});

});

}

async function createPeer(id){

if(peers[id])return;

const pc=new RTCPeerConnection(rtcConfig);

peers[id]={
pc,
candidateQueue:[]
};

if(localStream){

localStream.getTracks().forEach(track=>{
pc.addTrack(track,localStream);
});

}else{

pc.addTransceiver("audio",{direction:"recvonly"});
pc.addTransceiver("video",{direction:"recvonly"});

}

pc.ontrack=e=>{

const video=document.getElementById("video-"+id);

if(video){

if(e.streams&&e.streams[0]){
video.srcObject=e.streams[0];
}else{

if(!video.srcObject)
video.srcObject=new MediaStream();

video.srcObject.addTrack(e.track);

}

video.play().catch(()=>{});

}

setStatus("🟢 Connected to learner");

};

pc.onicecandidate=async e=>{

if(!e.candidate)return;

try{

const r=push(
ref(db,
"liveClasses/"+liveId+
"/participants/"+id+
"/teacherCandidates"
)
);

await set(r,e.candidate.toJSON());

}catch(err){

console.error("Teacher ICE error",err);

}

};

pc.onconnectionstatechange=()=>{

console.log("Teacher peer",id,pc.connectionState);

if(pc.connectionState==="connected"){
setStatus("🟢 Learner connected");
}

if(pc.connectionState==="failed"||
pc.connectionState==="disconnected"){

setStatus("⚠️ Learner connection lost");

}

};

const answerRef=ref(
db,
"liveClasses/"+liveId+
"/participants/"+id+"/answer"
);

onValue(answerRef,async snap=>{

const answer=snap.val();

if(!answer)return;

try{

if(pc.signalingState==="have-local-offer"&&
!pc.currentRemoteDescription){

await pc.setRemoteDescription(
new RTCSessionDescription(answer)
);

const p=peers[id];

for(const c of p.candidateQueue){

try{
await pc.addIceCandidate(
new RTCIceCandidate(c)
);
}catch(e){}

}

p.candidateQueue=[];

}

}catch(e){

console.error("Answer error",e);

}

});

const learnerCandidatesRef=ref(
db,
"liveClasses/"+liveId+
"/participants/"+id+
"/participantCandidates"
);

onChildAdded(learnerCandidatesRef,async snap=>{

const c=snap.val();

if(!c)return;

try{

if(pc.remoteDescription){

await pc.addIceCandidate(
new RTCIceCandidate(c)
);

}else{

peers[id].candidateQueue.push(c);

}

}catch(e){

console.error("Learner ICE error",e);

}

});

try{

const offer=await pc.createOffer({
offerToReceiveAudio:true,
offerToReceiveVideo:true
});

await pc.setLocalDescription(offer);

await set(
ref(db,
"liveClasses/"+liveId+
"/participants/"+id+"/offer"
),
{
type:offer.type,
sdp:offer.sdp
}
);

console.log("Offer sent to",id);

}catch(e){

console.error("Offer error",e);
setStatus("❌ Could not connect to learner");

}

}

function listenChat(){

const chatRef=ref(db,"liveClasses/"+liveId+"/chat");

onChildAdded(chatRef,snap=>{

const m=snap.val()||{};

const div=document.createElement("div");
div.className="msg";

div.innerHTML=
"<b>"+escapeHtml(m.name||"User")+
":</b> "+escapeHtml(m.text||"");

chatBox.appendChild(div);
chatBox.scrollTop=chatBox.scrollHeight;

});

}

function escapeHtml(s){

return String(s).replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

}

$("sendBtn").onclick=sendChat;

chatInput.addEventListener("keydown",e=>{
if(e.key==="Enter")sendChat();
});

async function sendChat(){

const text=chatInput.value.trim();

if(!text)return;

await push(
ref(db,"liveClasses/"+liveId+"/chat"),
{
name:session.name||"Teacher",
id:session.id,
role:"teacher",
text,
time:now()
}
);

chatInput.value="";

}

$("micBtn").onclick=()=>{

if(!localStream)return;

const t=localStream.getAudioTracks()[0];

if(!t)return;

t.enabled=!t.enabled;

$("micBtn").textContent=
t.enabled?"🎤 Mic On":"🔇 Mic Off";

};

$("cameraBtn").onclick=()=>{

if(!localStream)return;

const t=localStream.getVideoTracks()[0];

if(!t)return;

t.enabled=!t.enabled;

$("cameraBtn").textContent=
t.enabled?"📷 Camera On":"📷 Camera Off";

};

$("switchBtn").onclick=async()=>{

if(!navigator.mediaDevices)return;

currentFacing=currentFacing==="user"?"environment":"user";

try{

const newStream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:currentFacing},
audio:false
});

const newTrack=newStream.getVideoTracks()[0];

const old=localStream.getVideoTracks()[0];

localStream.removeTrack(old);
old.stop();

localStream.addTrack(newTrack);
localVideo.srcObject=localStream;

Object.values(peers).forEach(p=>{

const sender=p.pc.getSenders()
.find(s=>s.track&&s.track.kind==="video");

if(sender)sender.replaceTrack(newTrack);

});

}catch(e){

console.error(e);

}

};

$("torchBtn").onclick=async()=>{

if(!localStream)return;

const track=localStream.getVideoTracks()[0];

if(!track)return;

const caps=track.getCapabilities();

if(!caps.torch){

alert("Torch is not supported on this camera.");
return;

}

try{

const current=track.getSettings().torch||false;

await track.applyConstraints({
advanced:[{torch:!current}]
});

}catch(e){

alert("Torch could not be changed.");

}

};

$("endBtn").onclick=endClass;

async function endClass(){

if(!confirm("End this live class?"))return;

try{

clearInterval(heartbeat);

if(localStream){
localStream.getTracks().forEach(t=>t.stop());
}

Object.values(peers).forEach(p=>{
try{p.pc.close()}catch(e){}
});

await update(liveRef,{
status:"ended",
teacherOnline:false,
lastSeen:0,
endedAt:now()
});

await remove(
ref(db,
"liveClasses/"+liveId+
"/participants/"+session.id)
);

await update(ref(db,"classes/"+classId),{
liveStatus:"ended"
});

location.href="../dashboard.html";

}catch(e){

console.error(e);
alert("Could not end class.");

}

}

loadClass();

</script>
</body>
  </html>
