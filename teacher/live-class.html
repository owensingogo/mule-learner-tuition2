<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Test</title>

<style>
body{
font-family:Arial;
background:#f4f7fc;
text-align:center;
padding:20px;
}
button{
width:100%;
padding:15px;
background:#173b8f;
color:white;
border:0;
border-radius:10px;
font-weight:bold;
font-size:16px;
}
video{
width:100%;
margin-top:20px;
background:#111;
border-radius:12px;
}
#stop{
display:none;
background:#d92d20;
margin-top:10px;
}
</style>
</head>

<body>

<h2>🎓 Mule Learner Tuition</h2>
<p>Teacher Camera Test</p>

<button id="start" onclick="startCamera()">
📹 Start Camera
</button>

<button id="stop" onclick="stopCamera()">
⛔ Stop Camera
</button>

<video id="video" autoplay playsinline></video>

<p id="message">Camera is ready.</p>

<script>

let stream = null;

async function startCamera(){

try{

document.getElementById("message").textContent =
"Opening camera...";

stream =
await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

document.getElementById("video").srcObject =
stream;

document.getElementById("start").style.display =
"none";

document.getElementById("stop").style.display =
"block";

document.getElementById("message").textContent =
"✅ Camera and microphone are working.";

}catch(error){

console.log(error);

document.getElementById("message").textContent =
"❌ " + error.name + " — " + error.message;

alert(
"Camera test failed:\n\n" +
error.name + "\n" +
error.message
);

}

}

function stopCamera(){

if(stream){

stream.getTracks().forEach(function(track){
track.stop();
});

stream=null;

}

document.getElementById("video").srcObject=null;

document.getElementById("start").style.display="block";

document.getElementById("stop").style.display="none";

document.getElementById("message").textContent =
"Camera stopped.";

}

</script>

</body>
</html>
