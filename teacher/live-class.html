<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Teacher Live Class | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:bold}
.back{background:#fff;color:#173b8f}
.container{max-width:950px;margin:auto;padding:16px}
.hero{background:#173b8f;color:white;border-radius:14px;padding:18px;margin-bottom:15px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 3px 12px #0001}
video{width:100%;background:#111;border-radius:10px}
.mainVideo{min-height:260px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.controls button{background:#173b8f;color:#fff}
.controls .danger{background:#b00020}
.status{padding:10px;border-radius:9px;background:#eef3ff;margin-bottom:12px}
.person{padding:10px;border-bottom:1px solid #eee}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.remote{background:#111;border-radius:10px;overflow:hidden}
.remote video{height:180px;object-fit:cover}
.label{font-size:12px;color:#777;margin:7px}
#messages{height:180px;overflow:auto;border:1px solid #ddd;border-radius:9px;padding:8px}
.msg{font-size:13px;padding:6px;border-bottom:1px solid #eee}
.chat{display:flex;gap:7px;margin-top:8px}
.chat input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px}
</style>
</head>

<body>

<header>
<b>🎓 Mule Learner Tuition</b>
<button class="back" onclick="location.href='dashboard.html'">Dashboard</button>
</header>

<div class="container">

<div class="hero">
<h2 id="title">Live Classroom</h2>
<div id="info">Loading...</div>
</div>

<div class="status" id="status">Preparing classroom...</div>

<div class="card">
<div class="label">Teacher Camera</div>
<video id="localVideo" class="mainVideo" autoplay muted playsinline></video>

<div class="controls">
<button onclick="toggleMic()" id="micBtn">🎤 Mic On</button>
<button onclick="toggleCamera()" id="camBtn">📷 Camera On</button>
<button onclick="endClass()" class="danger">End Live Class</button>
</div>
</div>

<div class="card">
<b>👥 Participants: <span id="count">0</span></b>
<div id="participants"></div>
</div>

<div class="card">
<b>📹 Connected Participants</b>
<div id="videos" class="grid"></div>
</div>

<div class="card">
<b>💬 Live Chat</b>
<div id="messages"></div>
<div class="chat">
<input id="chatInput" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>
</div>

</div>

<script type="module">
import{initializeApp}from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import{
 getDatabase,ref,get,set,update,onValue,onChildAdded,
 push,onDisconnect,remove
}from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCRUQ0WJTsN5kQ5De-MGoN8Bd6u2t2vvmLF7M",
 authDomain:"mule-learner-tuition-264fe.firebaseapp.com",
 databaseURL:"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
 projectId:"mule-learner-tuition-264fe",
 storageBucket:"mule-learner-tuition-264fe.firebasestorage.app",
 messagingSenderId:"656883565460",
 appId:"1:656883565460:web:3aaa6a5b638a34a6d28581"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const session=JSON.parse(localStorage.getItem("muleCurrentUser")||"null");

if(!session||session.role!=="teacher"){
 alert("Teacher login required.");
 location.href="../login.html";
}

const teacherId=session.id;
const classId=new URLSearchParams(location.search).get("id");

let classData=null;
let liveId=null;
let localStream=null;
let mic=true;
let camera=true;

const peers={};
const processedCandidates={};

async function load(){

 if(!classId){
   setStatus("No class selected.");
   return;
 }

 const classSnap=await get(ref(db,"classes/"+classId));

 if(!classSnap.exists()){
   setStatus("Class not found.");
   return;
 }

 classData=classSnap.val();

 liveId=classData.liveClassId||classId;

 document.getElementById("title").textContent=
   classData.className||classData.name||"Live Class";

 document.getElementById("info").textContent=
   (classData.subject||"")+
   " • "+
   (classData.level||classData.grade||"");

 await startMedia();
 await startLive();

 listenParticipants();
 listenChat();
}

function setStatus(t){
 document.getElementById("status").textContent=t;
}

async function startMedia(){

 try{

   localStream=await navigator.mediaDevices.getUserMedia({
     video:true,
     audio:true
   });

   document.getElementById("localVideo").srcObject=localStream;

 }catch(e){

   console.error(e);

   setStatus(
     "Camera/microphone permission was not granted. You can still manage the class."
   );
 }
}

async function startLive(){

 const startedAt=Date.now();

 await set(ref(db,"liveClasses/"+liveId),{
   id:liveId,
   classId,
   title:classData.className||classData.name||"Live Class",
   subject:classData.subject||"",
   level:classData.level||classData.grade||"",
   grade:classData.level||classData.grade||"",
   status:"live",
   startedAt,
   teacherId,
   teacherName:session.name||"Teacher"
 });

 await update(ref(db,"classes/"+classId),{
   liveClassId:liveId,
   liveStatus:"live",
   liveStartedAt:startedAt
 });

 const teacherRef=
   ref(db,`liveClasses/${liveId}/participants/${teacherId}`);

 await set(teacherRef,{
   id:teacherId,
   name:session.name||"Teacher",
   role:"teacher",
   mic:true,
   camera:true,
   joinedAt:startedAt
 });

 onDisconnect(teacherRef).remove();

 setStatus("🔴 LIVE — waiting for learners");
 await notifyCEO();
}

async function notifyCEO(){

 const id="NOT-"+Date.now()+"-"+Math.random()
 .toString(36).substring(2,7).toUpperCase();

 await set(ref(db,"notifications/"+id),{
   id,
   type:"teacher_live_start",
   title:"🔴 Teacher Started Live Class",
   message:
     (session.name||"Teacher")+
     " has started "+(classData.className||"a live class")+".",
   teacherId,
   teacherName:session.name||"Teacher",
   classId,
   liveClassId:liveId,
   subject:classData.subject||"",
   level:classData.level||classData.grade||"",
   read:false,
   createdAt:new Date().toISOString(),
   createdBy:"Teacher Live Class"
 });
}

/* =========================
   WEBRTC TEACHER HUB
========================= */

function listenParticipants(){

 onValue(ref(db,`liveClasses/${liveId}/participants`),snap=>{

   const data=snap.val()||{};
   const people=Object.values(data)
     .filter(p=>p.role!=="teacher");

   document.getElementById("count").textContent=
     people.length;

   document.getElementById("participants").innerHTML=
     people.map(p=>`
       <div class="person">
       👤 <b>${escapeHTML(p.name||"Participant")}</b>
       <br>
       <small>
       ${p.role||""}
       • Mic ${p.mic?"On":"Off"}
       • Camera ${p.camera?"On":"Off"}
       </small>
       </div>
     `).join("");

   people.forEach(p=>createPeer(p.id,p));
 });
}

async function createPeer(participantId,participant){

 if(peers[participantId])return;

 const pc=new RTCPeerConnection({
   iceServers:[
     {urls:"stun:stun.l.google.com:19302"},
     {urls:"stun:stun1.l.google.com:19302"}
   ]
 });

 peers[participantId]=pc;
 processedCandidates[participantId]=new Set();

 if(localStream){
   localStream.getTracks().forEach(track=>{
     pc.addTrack(track,localStream);
   });
 }

 pc.ontrack=e=>{

   if(!e.streams[0])return;

   let box=document.getElementById(
     "remote-"+participantId
   );

   if(!box){

     box=document.createElement("div");
     box.className="remote";
     box.id="remote-"+participantId;

     const video=document.createElement("video");
     video.autoplay=true;
     video.playsInline=true;
     video.id="video-"+participantId;

     const label=document.createElement("div");
     label.className="label";
     label.textContent=
       (participant.name||"Participant")+
       " • "+(participant.role||"");

     box.appendChild(video);
     box.appendChild(label);

     document.getElementById("videos").appendChild(box);
   }

   document.getElementById(
     "video-"+participantId
   ).srcObject=e.streams[0];
 };

 pc.onicecandidate=e=>{

   if(!e.candidate)return;

   const key=push(ref(db,
     `liveClasses/${liveId}/participants/${participantId}/teacherCandidates`
   )).key;

   set(ref(db,
     `liveClasses/${liveId}/participants/${participantId}/teacherCandidates/${key}`
   ),e.candidate.toJSON());
 };

 onValue(ref(db,
   `liveClasses/${liveId}/participants/${participantId}/answer`
 ),async snap=>{

   if(!snap.exists())return;

   try{
     if(!pc.currentRemoteDescription)
       await pc.setRemoteDescription(snap.val());
   }catch(e){
     console.log("Answer error",e);
   }
 });

 onChildAdded(ref(db,
   `liveClasses/${liveId}/participants/${participantId}/participantCandidates`
 ),async snap=>{

   if(processedCandidates[participantId]
      .has(snap.key))return;

   processedCandidates[participantId].add(snap.key);

   try{
     await pc.addIceCandidate(snap.val());
   }catch(e){}
 });

 const offer=await pc.createOffer();

 await pc.setLocalDescription(offer);

 await set(ref(db,
   `liveClasses/${liveId}/participants/${participantId}/offer`
 ),{
   type:offer.type,
   sdp:offer.sdp
 });
}

/* =========================
   CONTROLS
========================= */

window.toggleMic=async function(){

 if(!localStream)return;

 mic=!mic;

 localStream.getAudioTracks()
 .forEach(t=>t.enabled=mic);

 document.getElementById("micBtn").textContent=
   mic?"🎤 Mic On":"🎤 Mic Off";

 await update(ref(db,
   `liveClasses/${liveId}/participants/${teacherId}`
 ),{mic});
};

window.toggleCamera=async function(){

 if(!localStream)return;

 camera=!camera;

 localStream.getVideoTracks()
 .forEach(t=>t.enabled=camera);

 document.getElementById("camBtn").textContent=
   camera?"📷 Camera On":"📷 Camera Off";

 await update(ref(db,
   `liveClasses/${liveId}/participants/${teacherId}`
 ),{camera});
};

window.endClass=async function(){

 if(!confirm("End this live class?"))return;

 await update(ref(db,"liveClasses/"+liveId),{
   status:"ended",
   endedAt:Date.now()
 });

 await update(ref(db,"classes/"+classId),{
   liveStatus:"ended"
 });

 Object.values(peers).forEach(pc=>pc.close());

 if(localStream)
   localStream.getTracks().forEach(t=>t.stop());

 location.href="dashboard.html";
};

/* =========================
   CHAT
========================= */

function listenChat(){

 onChildAdded(ref(db,`liveClasses/${liveId}/chat`),snap=>{

   const m=snap.val();

   const div=document.createElement("div");
   div.className="msg";
   div.textContent=
     (m.name||"User")+": "+(m.message||"");

   document.getElementById("messages").appendChild(div);

   const box=document.getElementById("messages");
   box.scrollTop=box.scrollHeight;
 });
}

window.sendMessage=async function(){

 const input=document.getElementById("chatInput");
 const message=input.value.trim();

 if(!message)return;

 const key=push(ref(db,
   `liveClasses/${liveId}/chat`
 )).key;

 await set(ref(db,
   `liveClasses/${liveId}/chat/${key}`
 ),{
   name:session.name||"Teacher",
   role:"teacher",
   message,
   createdAt:Date.now()
 });

 input.value="";
};

function escapeHTML(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

load().catch(e=>{
 console.error(e);
 setStatus("Unable to start live class.");
});
</script>

</body>
</html>
