<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173b8f">

<title>Teacher Live Class | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

.header{
background:#173b8f;
color:white;
padding:18px;
text-align:center;
}

.header h2{
margin:0;
font-size:20px;
}

.container{
max-width:600px;
margin:auto;
padding:15px;
}

.card{
background:white;
border-radius:14px;
padding:16px;
margin-bottom:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.title{
font-size:17px;
font-weight:bold;
margin-bottom:8px;
}

.status{
display:inline-block;
padding:7px 12px;
border-radius:20px;
background:#eee;
font-size:12px;
font-weight:bold;
}

.live{
background:#dcfce7;
color:#15803d;
}

video{
width:100%;
height:250px;
background:#111;
border-radius:12px;
object-fit:cover;
margin-top:12px;
}

.remote-video{
width:100%;
height:180px;
background:#111;
border-radius:10px;
object-fit:cover;
margin-top:10px;
display:none;
}

button{
border:0;
border-radius:10px;
padding:12px;
font-weight:bold;
font-size:13px;
cursor:pointer;
}

.start{
background:#173b8f;
color:white;
width:100%;
margin-top:12px;
}

.end{
background:#dc2626;
color:white;
width:100%;
margin-top:10px;
}

.controls{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:12px;
}

.control{
background:#eef3ff;
color:#173b8f;
}

.control.off{
background:#fee2e2;
color:#b91c1c;
}

.timer{
text-align:center;
font-size:24px;
font-weight:bold;
margin:12px;
}

.chat{
height:150px;
overflow-y:auto;
background:#f7f8fa;
padding:10px;
border-radius:10px;
font-size:13px;
}

.chat-input{
display:flex;
gap:7px;
margin-top:8px;
}

.chat-input input{
flex:1;
padding:11px;
border:1px solid #ddd;
border-radius:9px;
}

.chat-input button{
background:#173b8f;
color:white;
}

.learner-box{
border-top:1px solid #eee;
padding-top:12px;
margin-top:12px;
}

.learner-name{
font-weight:bold;
font-size:13px;
margin-bottom:5px;
}

.audio-status{
font-size:11px;
color:#667085;
margin-top:5px;
}

.back{
display:block;
text-align:center;
margin:18px 0;
color:#173b8f;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
<h2>🎓 Mule Learner Tuition</h2>
<p>Teacher Live Classroom</p>
</div>

<div class="container">

<div class="card">

<div class="title">📚 Grade 10 Mathematics</div>

<p><b>Subject:</b> Mathematics</p>
<p><b>Class:</b> Grade 10</p>
<p><b>Teacher:</b> Teacher</p>

<span id="status" class="status">OFFLINE</span>

<button id="startBtn"
class="start"
type="button"
onclick="startClass()">
▶️ Start Live Class
</button>

<button id="endBtn"
class="end"
type="button"
onclick="endClass()"
style="display:none">
⏹️ End Class
</button>

</div>

<div class="card">

<div class="title">🎥 Teacher Camera</div>

<video
id="teacherVideo"
autoplay
playsinline
muted>
</video>

<div id="timer" class="timer">
00:00:00
</div>

<div class="controls">

<button id="micBtn"
class="control off"
type="button"
onclick="toggleMicrophone()">
🎤 Mic OFF
</button>

<button id="cameraBtn"
class="control off"
type="button"
onclick="toggleCamera()">
📹 Camera OFF
</button>

<button id="speakerBtn"
class="control"
type="button"
onclick="toggleSpeaker()">
🔊 Speaker ON
</button>

<button class="control"
type="button"
onclick="toggleFullscreen()">
⛶ Fullscreen
</button>

</div>

</div>

<div class="card">

<div class="title">👥 Learners</div>

<p>
Learners in class:
<b id="learnerCount">0</b>
</p>

<div id="learnersContainer"></div>

</div>

<div class="card">

<div class="title">💬 Live Chat</div>

<div id="chat" class="chat">
No messages yet.
</div>

<div class="chat-input">

<input
id="chatInput"
type="text"
placeholder="Type a message..."
onkeydown="handleChatKey(event)">

<button
type="button"
onclick="sendMessage()">
Send
</button>

</div>

</div>

<a href="dashboard.html" class="back">
← Back to Teacher Dashboard
</a>

</div>


<script src="../js/app.js"></script>
<script src="../js/teacher.js"></script>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getDatabase,
ref,
set,
update,
get,
onValue,
push,
onChildAdded,
onChildRemoved,
onDisconnect,
remove
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* ==============================
FIREBASE
============================== */

const firebaseConfig={

apiKey:"AIzaSyCRW0JTsN5kQ5De-MgoN8Bd6u2t2VvmLF7M",

authDomain:
"mule-learner-tuition-264fe.firebaseapp.com",

databaseURL:
"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",

projectId:
"mule-learner-tuition-264fe",

storageBucket:
"mule-learner-tuition-264fe.firebasestorage.app",

messagingSenderId:
"656883565460",

appId:
"1:656883565460:web:3aaa6a5b638a34a6d28581"

};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* ==============================
CLASS
============================== */

const CLASS_ID="grade10-mathematics";


/* ==============================
VARIABLES
============================== */

let stream=null;

let timerInterval=null;

let seconds=0;

let micOn=false;

let cameraOn=false;

let speakerOn=true;

let classStarted=false;

const peerConnections={};

const configuration={

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
}

]

};


/* ==============================
START CLASS
============================== */

window.startClass=async function(){

if(classStarted)return;

try{

stream=
await navigator.mediaDevices.getUserMedia({

video:true,

audio:true

});


const video=
document.getElementById("teacherVideo");

video.srcObject=stream;


/*
Start with mic and camera OFF
*/

stream.getVideoTracks()
.forEach(track=>track.enabled=false);

stream.getAudioTracks()
.forEach(track=>track.enabled=false);

micOn=false;

cameraOn=false;

classStarted=true;


/* UI */

document.getElementById("status")
.textContent="LIVE";

document.getElementById("status")
.className="status live";

document.getElementById("startBtn")
.style.display="none";

document.getElementById("endBtn")
.style.display="block";


updateButtons();


/* Firebase live status */

await set(

ref(
db,
"liveClasses/"+CLASS_ID
),

{

classId:CLASS_ID,

title:"Grade 10 Mathematics",

subject:"Mathematics",

grade:"Grade 10",

status:"live",

startedAt:Date.now()

}

);


/* Teacher node */

await set(

ref(
db,
"liveClasses/"+CLASS_ID+"/teacher"
),

{

status:"live",

startedAt:Date.now()

}

);


/* Timer */

seconds=0;

timerInterval=setInterval(updateTimer,1000);


/* Listen for learners */

listenForLearners();


/* Chat */

listenForChat();


alert("🎥 Live Class Started Successfully!");

}catch(error){

console.error(error);

alert(
"Camera or microphone could not start.\n\n"+
"Please allow camera and microphone permission."
);

}

};


/* ==============================
LEARNERS
============================== */

function listenForLearners(){

onValue(

ref(
db,
"liveClasses/"+CLASS_ID+"/learners"
),

snapshot=>{

const learners=snapshot.val()||{};

const ids=Object.keys(learners);

document.getElementById("learnerCount")
.textContent=ids.length;

const container=
document.getElementById("learnersContainer");

container.innerHTML="";


ids.forEach(id=>{

const learner=learners[id];

const box=
document.createElement("div");

box.className="learner-box";

box.id="learner-"+id;

box.innerHTML=`

<div class="learner-name">
👤 ${escapeHtml(learner.name||"Learner")}
</div>

<video
id="remote-${id}"
class="remote-video"
autoplay
playsinline>
</video>

<div class="audio-status"
id="audio-${id}">
🎤 Waiting for learner...
</div>

`;

container.appendChild(box);


/*
Create WebRTC connection
*/

if(!peerConnections[id]){

createPeerConnection(
id,
learner
);

}

});

});

}


/* ==============================
WEBRTC CONNECTION
============================== */

async function createPeerConnection(id,learner){

if(!stream)return;

const pc=
new RTCPeerConnection(configuration);

peerConnections[id]=pc;


/*
Send teacher camera + microphone
*/

stream.getTracks().forEach(track=>{

pc.addTrack(
track,
stream
);

});


/*
Receive learner camera + microphone
*/

pc.ontrack=function(event){

const video=
document.getElementById("remote-"+id);

if(video){

video.srcObject=
event.streams[0];

video.style.display="block";

}

const audio=
document.getElementById("audio-"+id);

if(audio){

audio.textContent=
"🎤 Learner audio connected";

}

};


/*
ICE candidates from teacher
*/

pc.onicecandidate=function(event){

if(event.candidate){

push(

ref(
db,
"liveClasses/"+CLASS_ID+
"/learners/"+id+
"/teacherCandidates"
),

event.candidate.toJSON()

);

}

};


/*
Create offer
*/

const offer=
await pc.createOffer();

await pc.setLocalDescription(offer);


/*
Send offer to learner
*/

await set(

ref(
db,
"liveClasses/"+CLASS_ID+
"/learners/"+id+
"/offer"
),

offer.toJSON()

);


/*
Listen for answer
*/

onValue(

ref(
db,
"liveClasses/"+CLASS_ID+
"/learners/"+id+
"/answer"
),

async snapshot=>{

const answer=snapshot.val();

if(
answer &&
pc.signalingState!=="stable"
){

try{

await pc.setRemoteDescription(
new RTCSessionDescription(answer)
);

}catch(error){

console.log(
"Answer error:",
error
);

}

}

});


/*
Listen for learner ICE candidates
*/

onChildAdded(

ref(
db,
"liveClasses/"+CLASS_ID+
"/learners/"+id+
"/learnerCandidates"
),

async snapshot=>{

try{

await pc.addIceCandidate(
new RTCIceCandidate(
snapshot.val()
)
);

}catch(error){

console.log(
"ICE error:",
error
);

}

});

}


/* ==============================
REMOVE CONNECTION
============================== */

function cleanupLearner(id){

if(peerConnections[id]){

peerConnections[id].close();

delete peerConnections[id];

}

}


/* ==============================
END CLASS
============================== */

window.endClass=async function(){

if(
!confirm("End this live class?")
)return;


Object.keys(peerConnections)
.forEach(cleanupLearner);


if(stream){

stream.getTracks()
.forEach(track=>track.stop());

stream=null;

}


if(timerInterval){

clearInterval(timerInterval);

timerInterval=null;

}


await update(

ref(
db,
"liveClasses/"+CLASS_ID
),

{

status:"ended",

endedAt:Date.now()

}

);


document.getElementById("teacherVideo")
.srcObject=null;

document.getElementById("status")
.textContent="OFFLINE";

document.getElementById("status")
.className="status";

document.getElementById("startBtn")
.style.display="block";

document.getElementById("endBtn")
.style.display="none";

document.getElementById("timer")
.textContent="00:00:00";

classStarted=false;

};


/* ==============================
MICROPHONE
============================== */

window.toggleMicrophone=function(){

if(!stream){

alert("Start the live class first.");

return;

}

micOn=!micOn;

stream.getAudioTracks()
.forEach(track=>{
track.enabled=micOn;
});

updateButtons();

};


/* ==============================
CAMERA
============================== */

window.toggleCamera=function(){

if(!stream){

alert("Start the live class first.");

return;

}

cameraOn=!cameraOn;

stream.getVideoTracks()
.forEach(track=>{
track.enabled=cameraOn;
});

updateButtons();

};


/* ==============================
SPEAKER
============================== */

window.toggleSpeaker=function(){

speakerOn=!speakerOn;

document.querySelectorAll(".remote-video")
.forEach(video=>{
video.muted=!speakerOn;
});

document.getElementById("speakerBtn")
.textContent=
speakerOn
?"🔊 Speaker ON"
:"🔇 Speaker OFF";

};


/* ==============================
BUTTONS
============================== */

function updateButtons(){

document.getElementById("micBtn")
.textContent=
micOn
?"🎤 Mic ON"
:"🎤 Mic OFF";

document.getElementById("cameraBtn")
.textContent=
cameraOn
?"📹 Camera ON"
:"📹 Camera OFF";

}


/* ==============================
TIMER
============================== */

function updateTimer(){

seconds++;

const h=
Math.floor(seconds/3600);

const m=
Math.floor((seconds%3600)/60);

const s=
seconds%60;

document.getElementById("timer")
.textContent=

String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}


/* ==============================
FULLSCREEN
============================== */

window.toggleFullscreen=function(){

const card=
document.querySelectorAll(".card")[1];

if(!document.fullscreenElement){

card.requestFullscreen?.();

}else{

document.exitFullscreen?.();

}

};


/* ==============================
CHAT
============================== */

window.sendMessage=function(){

const input=
document.getElementById("chatInput");

const message=
input.value.trim();

if(!message)return;

push(

ref(
db,
"liveClasses/"+CLASS_ID+"/chat"
),

{

sender:"Teacher",

message:message,

time:Date.now()

}

);

input.value="";

};


function listenForChat(){

onValue(

ref(
db,
"liveClasses/"+CLASS_ID+"/chat"
),

snapshot=>{

const data=snapshot.val()||{};

const chat=
document.getElementById("chat");

chat.innerHTML="";

Object.values(data)
.sort((a,b)=>
(a.time||0)-(b.time||0)
)
.forEach(msg=>{

const item=
document.createElement("div");

item.style.padding="6px 0";

item.textContent=
"👤 "+(msg.sender||"User")+
": "+(msg.message||"");

chat.appendChild(item);

});

chat.scrollTop=
chat.scrollHeight;

});

}


window.handleChatKey=function(event){

if(event.key==="Enter"){

event.preventDefault();

sendMessage();

}

};


/* ==============================
HELPER
============================== */

function escapeHtml(text){

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

</script>

</body>
</html>
