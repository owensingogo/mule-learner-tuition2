<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Teacher Live Class | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}
header{background:#173b8f;color:#fff;text-align:center;padding:15px}
header h2{margin:0;font-size:20px}
main{max-width:700px;margin:auto;padding:12px}
.card{background:#fff;padding:14px;margin-bottom:12px;border-radius:13px;box-shadow:0 3px 12px #0001}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:#eef3ff;padding:10px;border-radius:9px;font-size:12px}
.box b{display:block;margin-top:4px}
video{width:100%;background:#111;border-radius:11px;min-height:210px}
button{border:0;border-radius:9px;padding:11px;margin:3px;font-weight:bold}
.start{background:#16803c;color:#fff}
.end{background:#c62828;color:#fff}
.control{background:#173b8f;color:#fff}
.active{background:#0b6e4f!important}
button:disabled{opacity:.5}
.controls{text-align:center}
#timer{text-align:center;font-size:24px;font-weight:bold;margin:9px}
.notice{background:#fff3cd;padding:9px;border-radius:8px;font-size:12px}
#chat{height:130px;overflow:auto;background:#f5f5f5;padding:9px;border-radius:9px}
input{width:68%;padding:10px;border:1px solid #ccc;border-radius:8px}
.send{background:#173b8f;color:#fff}
</style>
</head>

<body>

<header>
<h2>🎓 Mule Learner Tuition</h2>
<small>Teacher Live Classroom</small>
</header>

<main>

<div class="card">
<h3>📚 Grade 10 Mathematics</h3>

<div class="info">

<div class="box">
Subject
<b>Mathematics</b>
</div>

<div class="box">
Class
<b>Grade 10</b>
</div>

<div class="box">
Teacher
<b id="teacherName">Teacher</b>
</div>

<div class="box">
Status
<b id="status">OFFLINE</b>
</div>

</div>
</div>


<div class="card">

<button class="start" id="startBtn" onclick="startClass()">
▶️ Start Live Class
</button>

<button class="end" id="endBtn" onclick="endClass()" disabled>
⏹️ End Class
</button>

<div id="timer">00:00:00</div>

<video id="teacherVideo" autoplay muted playsinline></video>

<div class="controls">

<button class="control" id="micBtn" onclick="toggleMic()">
🎤 Mic ON
</button>

<button class="control" id="cameraBtn" onclick="toggleCamera()">
📹 Camera ON
</button>

<button class="control" id="speakerBtn" onclick="toggleSpeaker()">
🔊 Speaker ON
</button>

<button class="control" onclick="goFullscreen()">
⛶ Fullscreen
</button>

</div>

<div class="notice" id="message">
Press Start Live Class to begin.
</div>

</div>


<div class="card">

<h3>👥 Learners: <span id="learnerCount">0</span></h3>

<div id="learners"></div>

</div>


<div class="card">

<h3>💬 Live Chat</h3>

<div id="chat"></div>

<br>

<input id="chatInput" placeholder="Type a message">

<button class="send" onclick="sendChat()">
Send
</button>

</div>

</main>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="../js/app.js"></script>

<script>

"use strict";


/* =========================
FIREBASE
========================= */

const firebaseConfig={

apiKey:"AIzaSyCRW0JTsN5kQ5De-MgoN8Bd6u2tVvmLF7M",

authDomain:"mule-learner-tuition-264fe.firebaseapp.com",

databaseURL:
"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",

projectId:"mule-learner-tuition-264fe",

storageBucket:
"mule-learner-tuition-264fe.firebasestorage.app",

messagingSenderId:"656883565460",

appId:
"1:656883565460:web:3aaa6a5b638a34a6d28581"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();


/* =========================
LOGIN
========================= */

const user=getCurrentUser();

if(!user){

window.location.href="../login.html";

}

if(user && user.role!=="teacher"){

alert("Teacher access only.");

window.location.href="../login.html";

}

document.getElementById("teacherName").textContent=
user ? (user.name||"Teacher") : "Teacher";


/* =========================
VARIABLES
========================= */

const CLASS_ID="grade10-mathematics";

let stream=null;

let timer=null;

let startTime=0;

let micOn=true;

let cameraOn=true;

let speakerOn=true;


/* =========================
GET CAMERA
========================= */

async function startCamera(){

if(stream){

return true;

}

try{

stream=await navigator.mediaDevices.getUserMedia({

video:true,

audio:true

});

document.getElementById("teacherVideo").srcObject=stream;

return true;

}catch(error){

console.error(error);

document.getElementById("message").textContent=
"⚠️ Camera or microphone could not be started.";

alert(
"Camera/microphone access failed. Make sure you are using the GitHub Pages HTTPS website."
);

return false;

}

}


/* =========================
START LIVE CLASS
========================= */

async function startClass(){

const ok=await startCamera();

if(!ok)return;

try{

await db.ref("liveClasses/"+CLASS_ID).set({

classId:CLASS_ID,

subject:"Mathematics",

grade:"Grade 10",

title:"Grade 10 Mathematics",

teacherId:user.id||"",

teacherName:user.name||"Teacher",

status:"live",

startedAt:
firebase.database.ServerValue.TIMESTAMP

});


document.getElementById("status").textContent="🔴 LIVE";

document.getElementById("status").style.color="#c62828";

document.getElementById("startBtn").disabled=true;

document.getElementById("endBtn").disabled=false;

document.getElementById("message").textContent=
"🔴 You are now teaching live.";

startTime=Date.now();

clearInterval(timer);

timer=setInterval(updateTimer,1000);

}catch(error){

console.error(error);

document.getElementById("message").textContent=
"⚠️ Could not connect to Firebase.";

alert("Could not start the live class.");

}

}


/* =========================
TIMER
========================= */

function updateTimer(){

let total=
Math.floor((Date.now()-startTime)/1000);

let h=Math.floor(total/3600);

total%=3600;

let m=Math.floor(total/60);

let s=total%60;

document.getElementById("timer").textContent=

[h,m,s].map(function(x){

return String(x).padStart(2,"0");

}).join(":");

}


/* =========================
MIC
========================= */

function toggleMic(){

if(!stream){

alert("Start the live class first.");

return;

}

const tracks=stream.getAudioTracks();

if(!tracks.length){

alert("No microphone was found.");

return;

}

micOn=!micOn;

tracks.forEach(function(track){

track.enabled=micOn;

});

document.getElementById("micBtn").textContent=
micOn ? "🎤 Mic ON" : "🔇 Mic OFF";

document.getElementById("micBtn")
.classList.toggle("active",micOn);

}


/* =========================
CAMERA
========================= */

function toggleCamera(){

if(!stream){

alert("Start the live class first.");

return;

}

const tracks=stream.getVideoTracks();

if(!tracks.length){

alert("No camera was found.");

return;

}

cameraOn=!cameraOn;

tracks.forEach(function(track){

track.enabled=cameraOn;

});

document.getElementById("cameraBtn").textContent=
cameraOn ? "📹 Camera ON" : "📷 Camera OFF";

document.getElementById("cameraBtn")
.classList.toggle("active",cameraOn);

}


/* =========================
SPEAKER
========================= */

function toggleSpeaker(){

speakerOn=!speakerOn;

const video=document.getElementById("teacherVideo");

video.muted=!speakerOn;

document.getElementById("speakerBtn").textContent=
speakerOn ? "🔊 Speaker ON" : "🔇 Speaker OFF";

document.getElementById("speakerBtn")
.classList.toggle("active",speakerOn);

}


/* =========================
FULLSCREEN
========================= */

function goFullscreen(){

const video=document.getElementById("teacherVideo");

if(video.requestFullscreen){

video.requestFullscreen();

}else if(video.webkitRequestFullscreen){

video.webkitRequestFullscreen();

}else{

alert("Fullscreen is not supported.");

}

}


/* =========================
END CLASS
========================= */

async function endClass(){

if(!confirm("End this live class?")){

return;

}

try{

await db.ref("liveClasses/"+CLASS_ID).update({

status:"ended",

endedAt:
firebase.database.ServerValue.TIMESTAMP

});

}catch(error){

console.error(error);

}


if(stream){

stream.getTracks().forEach(function(track){

track.stop();

});

stream=null;

}

clearInterval(timer);

document.getElementById("teacherVideo").srcObject=null;

document.getElementById("status").textContent="OFFLINE";

document.getElementById("status").style.color="#16803c";

document.getElementById("startBtn").disabled=false;

document.getElementById("endBtn").disabled=true;

document.getElementById("timer").textContent="00:00:00";

document.getElementById("message").textContent=
"Live class ended.";

}


/* =========================
CHAT
========================= */

function sendChat(){

const input=document.getElementById("chatInput");

const text=input.value.trim();

if(!text)return;

db.ref("liveClasses/"+CLASS_ID+"/chat").push({

name:user.name||"Teacher",

message:text,

time:firebase.database.ServerValue.TIMESTAMP

});

input.value="";

}


db.ref("liveClasses/"+CLASS_ID+"/chat")
.on("child_added",function(snapshot){

const data=snapshot.val();

const div=document.createElement("div");

div.textContent=
(data.name||"User")+": "+(data.message||"");

document.getElementById("chat").appendChild(div);

const chat=document.getElementById("chat");

chat.scrollTop=chat.scrollHeight;

});


/* =========================
CHECK CURRENT LIVE STATUS
========================= */

db.ref("liveClasses/"+CLASS_ID)
.on("value",function(snapshot){

const data=snapshot.val();

if(!data)return;

if(data.status==="live"){

document.getElementById("status").textContent="🔴 LIVE";

document.getElementById("status").style.color="#c62828";

}

});


/* =========================
LEAVE WARNING
========================= */

window.addEventListener("beforeunload",function(e){

if(stream){

e.preventDefault();

e.returnValue="";

}

});

</script>

</body>
</html>
