<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Live Class | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033
}
.header{
background:#173b8f;
color:white;
padding:16px;
text-align:center
}
.header h2{margin:0;font-size:20px}
.header p{margin:5px 0 0;font-size:12px}
.card{
background:white;
margin:15px;
padding:16px;
border-radius:14px;
box-shadow:0 3px 15px #0001
}
.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
font-size:13px
}
.info div{
background:#f5f7fb;
padding:10px;
border-radius:9px
}
.status{
text-align:center;
font-weight:bold;
padding:10px;
border-radius:8px;
margin:12px 0;
background:#eee
}
video{
width:100%;
background:#111;
border-radius:12px;
max-height:300px
}
button{
border:0;
border-radius:9px;
padding:12px;
font-weight:bold;
font-size:13px;
cursor:pointer
}
.start{
width:100%;
background:#16803c;
color:white
}
.end{
width:100%;
background:#c62828;
color:white;
margin-top:8px
}
.controls{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:10px
}
.controls button{
background:#173b8f;
color:white
}
#endBtn,#controls,#videoBox,#chatBox{
display:none
}
.timer{
text-align:center;
font-size:22px;
font-weight:bold;
margin:12px
}
.chat{
height:160px;
overflow:auto;
background:#f5f7fb;
padding:10px;
border-radius:9px;
font-size:12px
}
.chatrow{
display:flex;
gap:5px;
margin-top:8px
}
.chatrow input{
flex:1;
padding:10px;
border:1px solid #ddd;
border-radius:8px
}
.chatrow button{
background:#173b8f;
color:white
}
</style>
</head>

<body>

<div class="header">
<h2>🎓 Mule Learner Tuition</h2>
<p>Teacher Live Classroom</p>
</div>

<div class="card">

<h3>📚 Grade 10 Mathematics</h3>

<div class="info">
<div><b>Subject</b><br>Mathematics</div>
<div><b>Class</b><br>Grade 10</div>
<div><b>Teacher</b><br><span id="teacherName">Teacher</span></div>
<div><b>Learners</b><br><span id="learnerCount">0</span></div>
</div>

<div id="status" class="status">OFFLINE</div>

<button id="startBtn" class="start" onclick="startClass()">
▶️ Start Live Class
</button>

<button id="endBtn" class="end" onclick="endClass()">
⏹️ End Live Class
</button>

<div id="videoBox">
<video id="teacherVideo" autoplay muted playsinline></video>

<div class="timer" id="timer">00:00:00</div>

<div id="controls" class="controls">
<button onclick="toggleMicrophone()">🎤 Mic</button>
<button onclick="toggleCamera()">📹 Camera</button>
<button onclick="toggleSpeaker()">🔊 Speaker</button>
<button onclick="toggleFlash()">🔦 Flash</button>
<button onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>
</div>

</div>

<div id="chatBox" class="card">
<h3>💬 Live Chat</h3>

<div id="chat" class="chat"></div>

<div class="chatrow">
<input id="chatInput" placeholder="Type message...">
<button onclick="sendChat()">Send</button>
</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="../js/app.js"></script>

<script>
"use strict";

const firebaseConfig = {
apiKey:"AIzaSyCRW0JTsN5kQ5De-MgoN8Bd6u2tVvmLF7M",
authDomain:"mule-learner-tuition-264fe.firebaseapp.com",
databaseURL:"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
projectId:"mule-learner-tuition-264fe",
storageBucket:"mule-learner-tuition-264fe.firebasestorage.app",
messagingSenderId:"656883565460",
appId:"1:656883565460:web:3aaa6a5b638a34a6d28581"
};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const db=firebase.database();

const CLASS_ID="grade10-mathematics";

let user=getCurrentUser();
let stream=null;
let timerInterval=null;
let seconds=0;
let micOn=true;
let cameraOn=true;

if(!user){
window.location.href="../login.html";
}

if(user && user.role!=="teacher"){
alert("Teacher access only.");
window.location.href="../login.html";
}

if(user){
document.getElementById("teacherName").textContent=user.name || "Teacher";
}

/* START CLASS */

async function startClass(){

console.log("START BUTTON CLICKED");

const startBtn=document.getElementById("startBtn");

startBtn.disabled=true;
startBtn.textContent="Starting...";

try{

if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
alert("Your browser does not support camera access.");
startBtn.disabled=false;
startBtn.textContent="▶️ Start Live Class";
return;
}

stream=await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

document.getElementById("teacherVideo").srcObject=stream;

document.getElementById("videoBox").style.display="block";
document.getElementById("controls").style.display="grid";
document.getElementById("chatBox").style.display="block";

document.getElementById("startBtn").style.display="none";
document.getElementById("endBtn").style.display="block";

const status=document.getElementById("status");
status.textContent="🔴 LIVE NOW";
status.style.background="#ffe5e5";
status.style.color="#b00020";

seconds=0;

timerInterval=setInterval(function(){

seconds++;

let h=String(Math.floor(seconds/3600)).padStart(2,"0");
let m=String(Math.floor((seconds%3600)/60)).padStart(2,"0");
let s=String(seconds%60).padStart(2,"0");

document.getElementById("timer").textContent=h+":"+m+":"+s;

},1000);

/* Firebase update */
try{

await db.ref("liveClasses/"+CLASS_ID).set({
classId:CLASS_ID,
title:"Grade 10 Mathematics",
subject:"Mathematics",
grade:"Grade 10",
teacherId:user.id || "",
teacherName:user.name || "Teacher",
status:"live",
startedAt:firebase.database.ServerValue.TIMESTAMP
});

}catch(firebaseError){

console.log("Firebase error:",firebaseError);

}

/* Listen for learners */
db.ref("liveClasses/"+CLASS_ID+"/learners").on("value",function(snapshot){

if(snapshot.exists()){
document.getElementById("learnerCount").textContent=
snapshot.numChildren();
}else{
document.getElementById("learnerCount").textContent="0";
}

});

}catch(error){

console.log(error);

alert(
"Camera or microphone could not start.\n\n"+
"Please allow Camera and Microphone permission in your browser."
);

startBtn.disabled=false;
startBtn.textContent="▶️ Start Live Class";

}

}

/* END CLASS */

async function endClass(){

if(!confirm("Are you sure you want to end this live class?")){
return;
}

if(stream){

stream.getTracks().forEach(function(track){
track.stop();
});

stream=null;

}

clearInterval(timerInterval);

document.getElementById("teacherVideo").srcObject=null;

document.getElementById("videoBox").style.display="none";
document.getElementById("controls").style.display="none";
document.getElementById("chatBox").style.display="none";

document.getElementById("endBtn").style.display="none";
document.getElementById("startBtn").style.display="block";

document.getElementById("startBtn").disabled=false;
document.getElementById("startBtn").textContent="▶️ Start Live Class";

document.getElementById("status").textContent="OFFLINE";
document.getElementById("status").style.background="#eee";
document.getElementById("status").style.color="#172033";

try{

await db.ref("liveClasses/"+CLASS_ID).update({
status:"ended",
endedAt:firebase.database.ServerValue.TIMESTAMP
});

}catch(error){

console.log(error);

}

}

/* MICROPHONE */

function toggleMicrophone(){

if(!stream)return;

const tracks=stream.getAudioTracks();

if(!tracks.length)return;

micOn=!micOn;

tracks[0].enabled=micOn;

}

/* CAMERA */

function toggleCamera(){

if(!stream)return;

const tracks=stream.getVideoTracks();

if(!tracks.length)return;

cameraOn=!cameraOn;

tracks[0].enabled=cameraOn;

document.getElementById("teacherVideo").style.display=
cameraOn ? "block" : "none";

}

/* SPEAKER */

function toggleSpeaker(){

const video=document.getElementById("teacherVideo");

video.muted=!video.muted;

}

/* FLASH */

async function toggleFlash(){

if(!stream)return;

const track=stream.getVideoTracks()[0];

if(!track)return;

if(!track.getCapabilities){
alert("Flash is not supported on this device.");
return;
}

const capabilities=track.getCapabilities();

if(!capabilities.torch){
alert("Flash is not available on this camera.");
return;
}

try{

const current=track.getSettings().torch || false;

await track.applyConstraints({
advanced:[{torch:!current}]
});

}catch(error){

alert("Could not control the camera flash.");

}

}

/* FULLSCREEN */

function toggleFullscreen(){

const box=document.querySelector(".card");

if(document.fullscreenElement){
document.exitFullscreen();
}else if(box.requestFullscreen){
box.requestFullscreen();
}

}

/* CHAT */

function sendChat(){

const input=document.getElementById("chatInput");
const text=input.value.trim();

if(!text)return;

db.ref("liveClasses/"+CLASS_ID+"/chat").push({
name:user.name || "Teacher",
message:text,
time:firebase.database.ServerValue.TIMESTAMP
});

input.value="";

}

db.ref("liveClasses/"+CLASS_ID+"/chat").on("value",function(snapshot){

const chat=document.getElementById("chat");

chat.innerHTML="";

snapshot.forEach(function(item){

const data=item.val();

const div=document.createElement("div");

div.style.marginBottom="8px";

div.innerHTML="<b>"+
escapeHTML(data.name || "User")+
":</b> "+
escapeHTML(data.message || "");

chat.appendChild(div);

});

chat.scrollTop=chat.scrollHeight;

});

</script>

</body>
</html>
