<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#173b8f">
<title>Learner Registration | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f4f7fc;
color:#172033;
min-height:100vh;
padding:20px
}

.container{
width:100%;
max-width:450px;
margin:auto
}

.logo{
text-align:center;
margin:15px 0 20px
}

.logo h1{
color:#173b8f;
font-size:25px
}

.logo p{
color:#667085;
font-size:13px;
margin-top:4px
}

.card{
background:#fff;
padding:24px 20px;
border-radius:16px;
box-shadow:0 8px 30px rgba(20,50,100,.10)
}

h2{
font-size:22px;
margin-bottom:6px
}

.intro{
color:#667085;
font-size:13px;
margin-bottom:20px
}

label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px
}

input,select{
width:100%;
padding:13px;
border:1px solid #d8deea;
border-radius:9px;
font-size:15px;
outline:none;
margin-bottom:16px;
background:white
}

input:focus,select:focus{
border-color:#173b8f
}

.password-box{
position:relative
}

.password-box input{
padding-right:65px
}

.show{
position:absolute;
right:12px;
top:13px;
border:0;
background:none;
color:#173b8f;
font-weight:700;
cursor:pointer
}

button.register{
width:100%;
border:0;
background:#173b8f;
color:white;
padding:14px;
border-radius:9px;
font-size:15px;
font-weight:700;
cursor:pointer
}

.notice{
margin:16px 0;
padding:12px;
background:#eef3ff;
color:#475467;
border-radius:9px;
font-size:12px;
line-height:1.5
}

.error{
display:none;
background:#fff0f0;
color:#b42318;
padding:10px;
border-radius:8px;
font-size:12px;
margin-bottom:15px
}

.success{
display:none;
background:#ecfdf3;
color:#027a48;
padding:12px;
border-radius:8px;
font-size:13px;
margin-bottom:15px;
text-align:center
}

.links{
text-align:center;
margin-top:18px;
font-size:13px
}

.links a{
color:#173b8f;
font-weight:700;
text-decoration:none
}

.back{
display:block;
text-align:center;
margin:18px 0;
color:#667085;
font-size:13px;
text-decoration:none
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<h1>Mule Learner Tuition</h1>
<p>📚 Learn • Practice • Succeed</p>
</div>

<div class="card">

<h2>Create Learner Account</h2>

<p class="intro">
Join Mule Learner Tuition and start your learning journey.
</p>

<div id="error" class="error"></div>
<div id="success" class="success"></div>

<form onsubmit="registerLearner(event)">

<label>Full Name</label>
<input
type="text"
id="name"
placeholder="Enter your full name"
autocomplete="name"
required>

<label>Phone Number</label>
<input
type="tel"
id="phone"
placeholder="e.g. 0971234567"
autocomplete="tel"
required>

<label>Class / Level</label>

<select id="level" required>
<option value="">Select your class</option>
<option value="Grade 7">Grade 7</option>
<option value="Grade 8">Grade 8</option>
<option value="Grade 9">Grade 9</option>
<option value="Grade 10">Grade 10</option>
<option value="Grade 11">Grade 11</option>
<option value="Grade 12">Grade 12</option>
<option value="Other">Other</option>
</select>

<label>Password</label>

<div class="password-box">
<input
type="password"
id="password"
placeholder="Create a password"
autocomplete="new-password"
required>

<button
type="button"
class="show"
onclick="togglePassword('password',this)">
Show
</button>
</div>

<label>Confirm Password</label>

<div class="password-box">
<input
type="password"
id="confirm"
placeholder="Confirm your password"
autocomplete="new-password"
required>

<button
type="button"
class="show"
onclick="togglePassword('confirm',this)">
Show
</button>
</div>

<div class="notice">
🔐 Your phone number identifies your learner account.
Email is not required.
</div>

<button class="register" type="submit">
Create Learner Account
</button>

</form>

<div class="links">

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

<br>

<p>
Are you a teacher?
<a href="teacher-register.html">Apply as Teacher</a>
</p>

</div>

</div>

<a href="index.html" class="back">
← Back to Home
</a>

</div>

<script>

function togglePassword(id,button){

const input=document.getElementById(id);

if(input.type==="password"){
input.type="text";
button.textContent="Hide";
}else{
input.type="password";
button.textContent="Show";
}

}


/* ===== NORMALIZE ZAMBIAN PHONE ===== */

function normalizePhone(phone){

phone=String(phone||"").trim();

phone=phone.replace(/\s+/g,"");

if(phone.startsWith("+260")){
phone="0"+phone.substring(4);
}

if(phone.startsWith("260")){
phone="0"+phone.substring(3);
}

return phone;
}


/* ===== REGISTER LEARNER ===== */

function registerLearner(event){

event.preventDefault();

const name=
document.getElementById("name").value.trim();

const phone=
normalizePhone(
document.getElementById("phone").value
);

const level=
document.getElementById("level").value;

const password=
document.getElementById("password").value;

const confirmPassword=
document.getElementById("confirm").value;

const error=
document.getElementById("error");

const success=
document.getElementById("success");

error.style.display="none";
success.style.display="none";


if(name.length<2){

error.textContent=
"Please enter your full name.";

error.style.display="block";
return;
}


if(!/^0[97][0-9]{8}$/.test(phone)){

error.textContent=
"Please enter a valid Zambian phone number.";

error.style.display="block";
return;
}


if(!level){

error.textContent=
"Please select your class or level.";

error.style.display="block";
return;
}


if(password.length<6){

error.textContent=
"Password must be at least 6 characters.";

error.style.display="block";
return;
}


if(password!==confirmPassword){

error.textContent=
"Passwords do not match.";

error.style.display="block";
return;
}


/* ===== GET EXISTING USERS ===== */

let users=[];

try{

users=
JSON.parse(
localStorage.getItem("muleUsers")
)||[];

}catch(e){

users=[];
}


/* ===== CHECK PHONE ===== */

const existing=
users.find(function(user){

return normalizePhone(user.phone)===phone;

});


if(existing){

error.textContent=
"An account with this phone number already exists.";

error.style.display="block";

return;
}


/* ===== CREATE LEARNER ===== */

const learner={

id:
"LRN-"+Date.now().toString(36).toUpperCase(),

name:name,

phone:phone,

level:level,

password:password,

role:"learner",

status:"active",

createdAt:
new Date().toISOString()

};


/* ===== SAVE TO SAME STORAGE USED BY LOGIN ===== */

users.push(learner);

localStorage.setItem(
"muleUsers",
JSON.stringify(users)
);


/* ===== SAVE LEARNER COPY ===== */

let learners=[];

try{

learners=
JSON.parse(
localStorage.getItem("muleLearners")
)||[];

}catch(e){

learners=[];
}

learners.push(learner);

localStorage.setItem(
"muleLearners",
JSON.stringify(learners)
);


/* ===== SUCCESS ===== */

success.textContent=
"Welcome, "+name+
"! Your learner account has been created successfully.";

success.style.display="block";


/* ===== GO TO LOGIN ===== */

setTimeout(function(){

window.location.href="login.html";

},1200);

}

</script>

</body>
</html>
