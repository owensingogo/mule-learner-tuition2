
name: Build Mule Learner Tuition APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "app-icon.png"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prepare web directory
        run: |
          mkdir -p www
          echo '<html><body>Mule Learner Tuition</body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Create custom app icons
        run: |
          pip install pillow
          python - <<'PY'
          from PIL import Image
          import os

          icon = Image.open("app-icon.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for folder, size in sizes.items():
              path = os.path.join(base, folder)
              os.makedirs(path, exist_ok=True)
              resized = icon.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(path, "ic_launcher.png"))
              resized.save(os.path.join(path, "ic_launcher_round.png"))
          PY

      - name: Create Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mule-Learner-Tuition-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
