<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#173b8f">
<title>Teachers | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f4f7fc;
color:#172033;
padding-bottom:30px;
}

header{
background:#173b8f;
color:white;
padding:15px 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:18px;
font-weight:800;
}

.back{
border:1px solid rgba(255,255,255,.3);
background:rgba(255,255,255,.12);
color:white;
padding:8px 11px;
border-radius:7px;
font-size:12px;
text-decoration:none;
}

.hero{
background:#173b8f;
color:white;
padding:10px 18px 25px;
}

.hero h1{
font-size:23px;
margin-bottom:5px;
}

.hero p{
font-size:12px;
opacity:.9;
}

.container{
max-width:900px;
margin:auto;
padding:18px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:18px;
}

.stat{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 4px 15px rgba(20,50,100,.07);
}

.stat h3{
font-size:20px;
margin-top:5px;
}

.stat p{
font-size:11px;
color:#667085;
}

.search{
width:100%;
padding:12px;
border:1px solid #d0d5dd;
border-radius:9px;
font-size:13px;
margin-bottom:15px;
outline:none;
}

.teacher{
background:white;
padding:16px;
border-radius:12px;
margin-bottom:12px;
box-shadow:0 4px 15px rgba(20,50,100,.07);
}

.teacher-top{
display:flex;
justify-content:space-between;
gap:10px;
align-items:flex-start;
}

.name{
font-size:16px;
font-weight:800;
}

.phone{
font-size:12px;
color:#667085;
margin-top:4px;
}

.badge{
padding:5px 8px;
border-radius:20px;
font-size:10px;
font-weight:bold;
}

.active{
background:#e8f7ee;
color:#18794e;
}

.pending{
background:#fff4db;
color:#7a4f00;
}

.suspended{
background:#fdecec;
color:#b42318;
}

.rejected{
background:#fdecec;
color:#b42318;
}

.details{
margin-top:12px;
font-size:12px;
line-height:1.7;
color:#475467;
}

.actions{
display:flex;
gap:8px;
margin-top:13px;
flex-wrap:wrap;
}

button{
border:0;
padding:9px 12px;
border-radius:7px;
font-size:11px;
cursor:pointer;
}

.view{
background:#173b8f;
color:white;
}

.suspend{
background:#fdecec;
color:#b42318;
}

.reactivate{
background:#e8f7ee;
color:#18794e;
}

.empty{
background:white;
padding:25px;
border-radius:12px;
text-align:center;
font-size:12px;
color:#667085;
box-shadow:0 4px 15px rgba(20,50,100,.07);
}

.loading{
text-align:center;
font-size:11px;
color:#667085;
margin-bottom:15px;
}

footer{
text-align:center;
font-size:11px;
color:#667085;
margin-top:25px;
}

@media(min-width:650px){
.stats{
grid-template-columns:repeat(4,1fr);
}
}
</style>
</head>

<body>

<header>
<div class="logo">Mule Learner Tuition</div>
<a href="dashboard.html" class="back">Dashboard</a>
</header>

<div class="hero">
<h1>Teachers 👨‍🏫</h1>
<p>Manage teachers and their accounts.</p>
</div>

<div class="container">

<div id="loading" class="loading">
Loading teachers...
</div>

<div class="stats">

<div class="stat">
<h3 id="totalCount">0</h3>
<p>Total Teachers</p>
</div>

<div class="stat">
<h3 id="activeCount">0</h3>
<p>Active</p>
</div>

<div class="stat">
<h3 id="pendingCount">0</h3>
<p>Pending</p>
</div>

<div class="stat">
<h3 id="suspendedCount">0</h3>
<p>Suspended</p>
</div>

</div>

<input
id="search"
class="search"
type="search"
placeholder="Search teacher by name, phone or subject..."
autocomplete="off">

<div id="teachersList"></div>

<footer>
Mule Learner Tuition
<br>
CEO Administration • Learn • Practice • Succeed
</footer>

</div>

<script src="../js/auth.js"></script>

<script>

const DATABASE_URL =
"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com";


let allTeachers=[];


/* =========================
   CHECK CEO
========================= */

function checkCEO(){

try{

const user=
JSON.parse(
localStorage.getItem("muleCurrentUser")
);

if(!user ||
String(user.role||"").toLowerCase()!=="ceo"){

location.href="../login.html";
return false;
}

return true;

}catch(error){

location.href="../login.html";
return false;

}

}


/* =========================
   LOAD USERS DIRECTLY
========================= */

async function loadTeachers(){

const loading=
document.getElementById("loading");

try{

loading.style.display="block";
loading.textContent="Loading teachers...";


const response=
await fetch(
DATABASE_URL+"/users.json?cache="+Date.now(),
{
method:"GET",
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"Firebase returned "+response.status
);

}


const data=
await response.json();


console.log("Firebase users:",data);


allTeachers=[];


/*
   Firebase users is normally an OBJECT:
   
   users
      TCH-MTKFB40F
      LRN-MTKZMPED-N2CBL
      CEO-MULE-001

   We check every record and only
   keep role = teacher.
*/

if(data && typeof data==="object"){

Object.keys(data).forEach(function(key){

const user=data[key];

if(!user || typeof user!=="object"){
return;
}


const role=
String(user.role||"")
.trim()
.toLowerCase();


if(role==="teacher"){

/*
   Use Firebase key if the record
   doesn't contain its own id.
*/

if(!user.id){
user.id=key;
}

allTeachers.push(user);

}

});

}


console.log(
"Teachers found:",
allTeachers
);


updateStats();
renderTeachers(allTeachers);


loading.textContent=
"✓ Teachers updated";

setTimeout(function(){

loading.style.display="none";

},800);


}catch(error){

console.error(
"LOAD TEACHERS ERROR:",
error
);

loading.style.display="block";

loading.textContent=
"Unable to load teachers.";

document.getElementById(
"teachersList"
).innerHTML=
'<div class="empty">Unable to connect to Firebase.<br><br>Please check your internet connection.</div>';

}

}


/* =========================
   STATS
========================= */

function updateStats(){

let active=0;
let pending=0;
let suspended=0;

allTeachers.forEach(function(teacher){

const status=
String(teacher.status||"active")
.trim()
.toLowerCase();


if(status==="active"){
active++;
}

else if(status==="pending"){
pending++;
}

else if(status==="suspended"){
suspended++;
}

});


document.getElementById("totalCount")
.textContent=allTeachers.length;

document.getElementById("activeCount")
.textContent=active;

document.getElementById("pendingCount")
.textContent=pending;

document.getElementById("suspendedCount")
.textContent=suspended;

}


/* =========================
   RENDER TEACHERS
========================= */

function renderTeachers(teachers){

const list=
document.getElementById("teachersList");

list.innerHTML="";


if(!teachers.length){

list.innerHTML=
'<div class="empty">No teachers found in Firebase.</div>';

return;

}


teachers.forEach(function(teacher){

const status=
String(teacher.status||"active")
.trim()
.toLowerCase();


let statusClass="rejected";

if(status==="active"){
statusClass="active";
}

else if(status==="pending"){
statusClass="pending";
}

else if(status==="suspended"){
statusClass="suspended";
}


const card=
document.createElement("div");

card.className="teacher";


card.innerHTML=`

<div class="teacher-top">

<div>

<div class="name">
${escapeHTML(teacher.name||"Unnamed Teacher")}
</div>

<div class="phone">
${escapeHTML(teacher.phone||"No phone number")}
</div>

</div>

<span class="badge ${statusClass}">
${escapeHTML(status.toUpperCase())}
</span>

</div>

<div class="details">

<strong>Subject:</strong>
${escapeHTML(teacher.subject||"Not provided")}
<br>

<strong>Qualification:</strong>
${escapeHTML(teacher.qualification||"Not provided")}
<br>

<strong>Experience:</strong>
${escapeHTML(teacher.experience||"Not provided")}
<br>

<strong>Application ID:</strong>
${escapeHTML(teacher.applicationId||"Not provided")}

</div>

<div class="actions">

<button class="view">
View Details
</button>

${
status==="suspended"
?
'<button class="reactivate">Reactivate</button>'
:
status==="active"
?
'<button class="suspend">Suspend</button>'
:
''
}

</div>

`;


card.querySelector(".view")
.addEventListener("click",function(){

viewTeacher(teacher);

});


const action=
card.querySelector(".suspend");


if(action){

action.addEventListener("click",function(){

changeStatus(
teacher.id,
"suspended"
);

});

}


const reactivate=
card.querySelector(".reactivate");


if(reactivate){

reactivate.addEventListener("click",function(){

changeStatus(
teacher.id,
"active"
);

});

}


list.appendChild(card);

});

}


/* =========================
   SEARCH
========================= */

document.getElementById("search")
.addEventListener("input",function(){

const term=
this.value.trim().toLowerCase();


if(!term){

renderTeachers(allTeachers);
return;

}


const filtered=
allTeachers.filter(function(teacher){

return (

String(teacher.name||"")
.toLowerCase()
.includes(term)

||

String(teacher.phone||"")
.toLowerCase()
.includes(term)

||

String(teacher.subject||"")
.toLowerCase()
.includes(term)

||

String(teacher.qualification||"")
.toLowerCase()
.includes(term)

);

});


renderTeachers(filtered);

});


/* =========================
   VIEW
========================= */

function viewTeacher(teacher){

alert(
"Teacher Details\n\n"+
"Name: "+(teacher.name||"Not provided")+
"\nPhone: "+(teacher.phone||"Not provided")+
"\nSubject: "+(teacher.subject||"Not provided")+
"\nQualification: "+(teacher.qualification||"Not provided")+
"\nExperience: "+(teacher.experience||"Not provided")+
"\nApplication ID: "+(teacher.applicationId||"Not provided")+
"\nStatus: "+(teacher.status||"active")
);

}


/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(id,status){

if(!id){
alert("Teacher ID is missing.");
return;
}


const message=
status==="suspended"
?
"Are you sure you want to suspend this teacher?"
:
"Reactivate this teacher?";


if(!confirm(message)){
return;
}


try{

const response=
await fetch(
DATABASE_URL+
"/users/"+
encodeURIComponent(id)+
".json",
{
method:"PATCH",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
status:status,
updatedAt:new Date().toISOString(),
updatedBy:"CEO"
})
}
);


if(!response.ok){

throw new Error(
"Firebase update failed."
);

}


await loadTeachers();


alert(
status==="suspended"
?
"Teacher suspended successfully."
:
"Teacher reactivated successfully."
);


}catch(error){

console.error(error);

alert(
"Unable to update teacher."
);

}

}


/* =========================
   SECURITY
========================= */

if(checkCEO()){

loadTeachers();

setInterval(
loadTeachers,
10000
);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
