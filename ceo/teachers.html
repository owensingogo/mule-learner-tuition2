const DATABASE_URL =
"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com";


/* ================================
   FIREBASE GET
================================ */

async function firebaseGet(path){

const response=await fetch(
DATABASE_URL+"/"+path+".json",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Firebase connection failed."
);

}

return await response.json();

}


/* ================================
   FIREBASE ARRAY CONVERSION
================================ */

function toArray(data){

if(!data){
return [];
}

if(Array.isArray(data)){

return data
.map(function(item,index){

if(item && !item.id){
item.id="USER-"+index;
}

return item;

})
.filter(Boolean);

}

return Object.keys(data)
.map(function(key){

const item=data[key];

if(item && !item.id){
item.id=key;
}

return item;

})
.filter(Boolean);

}


/* ================================
   TEACHERS
================================ */

let allTeachers=[];


/* ================================
   LOAD TEACHERS
================================ */

async function loadTeachers(){

const loading=
document.getElementById("loading");

try{

const data=
await firebaseGet("users");

const users=
toArray(data);


/*
   IMPORTANT:
   Find teachers by ROLE.
   This means Sandra will appear
   even if her Firebase ID changes.
*/

allTeachers=
users.filter(function(user){

return String(user.role||"")
.trim()
.toLowerCase()==="teacher";

});


updateStats();

renderTeachers(allTeachers);


if(loading){

loading.textContent=
"✓ Teachers updated";

setTimeout(function(){

loading.style.display="none";

},1000);

}

}catch(error){

console.error(
"Teacher loading error:",
error
);

if(loading){

loading.textContent=
"Unable to load teachers.";

}

}

}


/* ================================
   STATS
================================ */

function updateStats(){

let active=0;
let pending=0;
let suspended=0;

allTeachers.forEach(function(teacher){

const status=
String(teacher.status||"active")
.toLowerCase();

if(status==="active"){
active++;
}

else if(status==="pending"){
pending++;
}

else if(status==="suspended"){
suspended++;
}

});

document.getElementById(
"totalCount"
).textContent=allTeachers.length;

document.getElementById(
"activeCount"
).textContent=active;

document.getElementById(
"pendingCount"
).textContent=pending;

document.getElementById(
"suspendedCount"
).textContent=suspended;

}


/* ================================
   RENDER
================================ */

function renderTeachers(teachers){

const list=
document.getElementById("teachersList");

list.innerHTML="";

if(!teachers.length){

list.innerHTML=
'<div class="empty">No teachers found.</div>';

return;

}

teachers.forEach(function(teacher){

const status=
String(teacher.status||"active")
.toLowerCase();

const statusClass=
status==="active"
?"active"
:status==="pending"
?"pending"
:status==="suspended"
?"suspended"
:"rejected";


const card=
document.createElement("div");

card.className="teacher";

card.innerHTML=`

<div class="teacher-top">

<div>

<div class="name">
${escapeHTML(teacher.name||"Unnamed Teacher")}
</div>

<div class="phone">
${escapeHTML(teacher.phone||"No phone number")}
</div>

</div>

<span class="badge ${statusClass}">
${escapeHTML(status.toUpperCase())}
</span>

</div>

<div class="details">

<strong>Subject:</strong>
${escapeHTML(teacher.subject||"Not provided")}
<br>

<strong>Qualification:</strong>
${escapeHTML(teacher.qualification||"Not provided")}
<br>

<strong>Experience:</strong>
${escapeHTML(teacher.experience||"Not provided")}
<br>

<strong>Application ID:</strong>
${escapeHTML(teacher.applicationId||"Not provided")}

</div>

<div class="actions">

<button class="view"
onclick='viewTeacher(${JSON.stringify(teacher)})'>
View Details
</button>

${
status==="suspended"
?
`<button class="reactivate"
onclick="changeStatus('${escapeJS(teacher.id)}','active')">
Reactivate
</button>`
:
status==="active"
?
`<button class="suspend"
onclick="changeStatus('${escapeJS(teacher.id)}','suspended')">
Suspend
</button>`
:
""
}

</div>
`;

list.appendChild(card);

});

}


/* ================================
   SEARCH
================================ */

document.getElementById(
"search"
).addEventListener(
"input",
function(){

const term=
this.value
.trim()
.toLowerCase();

if(!term){

renderTeachers(allTeachers);
return;

}

const filtered=
allTeachers.filter(function(teacher){

return (

String(teacher.name||"")
.toLowerCase()
.includes(term)

||

String(teacher.phone||"")
.toLowerCase()
.includes(term)

||

String(teacher.subject||"")
.toLowerCase()
.includes(term)

||

String(teacher.qualification||"")
.toLowerCase()
.includes(term)

);

});

renderTeachers(filtered);

});


/* ================================
   VIEW TEACHER
================================ */

function viewTeacher(teacher){

alert(
"Teacher Details\n\n"+
"Name: "+(teacher.name||"Not provided")+
"\nPhone: "+(teacher.phone||"Not provided")+
"\nSubject: "+(teacher.subject||"Not provided")+
"\nQualification: "+(teacher.qualification||"Not provided")+
"\nExperience: "+(teacher.experience||"Not provided")+
"\nApplication ID: "+(teacher.applicationId||"Not provided")+
"\nStatus: "+(teacher.status||"active")
);

}


/* ================================
   CHANGE STATUS
================================ */

async function changeStatus(id,status){

if(!id){
return;
}

const message=
status==="suspended"
?
"Are you sure you want to suspend this teacher?"
:
"Reactivate this teacher?";

if(!confirm(message)){
return;
}

try{

const response=
await fetch(
DATABASE_URL+"/users/"+encodeURIComponent(id)+".json",
{
method:"PATCH",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
status:status,
updatedAt:new Date().toISOString(),
updatedBy:"CEO"
})
}
);

if(!response.ok){

throw new Error(
"Unable to update teacher."
);

}

await loadTeachers();

alert(
status==="suspended"
?
"Teacher suspended successfully."
:
"Teacher reactivated successfully."
);

}catch(error){

console.error(error);

alert(
"Unable to update teacher. Please check your internet connection."
);

}

}


/* ================================
   SECURITY
================================ */

function checkCEO(){

let user=null;

try{

user=
JSON.parse(
localStorage.getItem("muleCurrentUser")
);

}catch(e){

user=null;

}

if(!user){

location.href="../login.html";
return false;

}

if(
String(user.role||"")
.toLowerCase()!=="ceo"
){

alert(
"You do not have permission to access this page."
);

location.href="../login.html";

return false;

}

return true;

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJS(value){

return String(value||"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,"&quot;")
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


/* ================================
   START
================================ */

document.addEventListener(
"DOMContentLoaded",
function(){

if(!checkCEO()){
return;
}

loadTeachers();

setInterval(
loadTeachers,
10000
);

});
