<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173b8f">
<title>Classes | Mule Learner Tuition</title><style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}
.header{
  background:#173b8f;
  color:white;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header h2{margin:0;font-size:20px}
.back{
  color:white;
  text-decoration:none;
  font-size:14px;
}
.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0001;
}
.card h3{margin:0 0 8px;color:#173b8f}
label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:10px 0 5px;
}
input,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:14px;
}
button{
  border:0;
  border-radius:8px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  width:100%;
  margin-top:14px;
  background:#173b8f;
  color:white;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat{
  background:#eef3ff;
  border-radius:10px;
  padding:12px 5px;
  text-align:center;
}
.stat b{
  display:block;
  font-size:20px;
  color:#173b8f;
}
.stat span{font-size:11px}
.class-card{
  border-left:4px solid #173b8f;
}
.class-row{
  font-size:13px;
  margin:5px 0;
}
.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  background:#e7f7ed;
  color:#17823b;
  font-size:11px;
  font-weight:bold;
}
.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.view{
  background:#173b8f;
  color:white;
  flex:1;
}
.delete{
  background:#ffe9e9;
  color:#c62828;
}
.empty{
  text-align:center;
  color:#777;
  padding:25px 10px;
}
.notice{
  background:#fff4d6;
  color:#7a5700;
  padding:10px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:12px;
}
</style></head><body><div class="header">
  <h2>📚 Classes</h2>
  <a class="back" href="dashboard.html">← Dashboard</a>
</div><div class="container">  <div class="notice">
    Classes created here are saved in Firebase and can be accessed by authorised users.
  </div>  <div class="card">
    <h3>➕ Create New Class</h3><form onsubmit="createClass(event)">

  <label>Class Name</label>
  <input id="className" type="text"
         placeholder="e.g. Grade 10 Mathematics"
         required>

  <label>Subject</label>
  <input id="subject" type="text"
         placeholder="e.g. Mathematics"
         required>

  <label>Teacher</label>
  <input id="teacher" type="text"
         placeholder="Teacher name"
         required>

  <label>Class Type</label>
  <select id="classType">
    <option value="Regular Class">Regular Class</option>
    <option value="Live Class">Live Class</option>
  </select>

  <button class="primary" type="submit">
    Create Class
  </button>

</form>

  </div>  <div class="card">
    <h3>📊 Class Overview</h3><div class="stats">
  <div class="stat">
    <b id="totalCount">0</b>
    <span>Total</span>
  </div>

  <div class="stat">
    <b id="activeCount">0</b>
    <span>Active</span>
  </div>

  <div class="stat">
    <b id="assignedCount">0</b>
    <span>Assigned</span>
  </div>
</div>

  </div>  <div class="card">
    <h3>📚 All Classes</h3>
    <div id="classesList">
      <div class="empty">Loading classes...</div>
    </div>
  </div></div><script src="../js/app.js"></script><script src="../js/ceo.js"></script><script>
const DB_URL =
"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com";

const CLASSES_PATH = "classes";

function showMessage(message){
  alert(message);
}

async function firebaseGet(path){
  const response = await fetch(
    DB_URL + "/" + path + ".json"
  );

  if(!response.ok){
    throw new Error("Firebase read failed");
  }

  return await response.json();
}

async function firebaseSet(path,data){
  const response = await fetch(
    DB_URL + "/" + path + ".json",
    {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    }
  );

  if(!response.ok){
    throw new Error("Firebase write failed");
  }

  return await response.json();
}

async function firebaseDelete(path){
  const response = await fetch(
    DB_URL + "/" + path + ".json",
    {
      method:"DELETE"
    }
  );

  if(!response.ok){
    throw new Error("Firebase delete failed");
  }
}

function createId(){
  return "CLS-" + Date.now();
}

async function createClass(event){

  event.preventDefault();

  const className =
    document.getElementById("className").value.trim();

  const subject =
    document.getElementById("subject").value.trim();

  const teacher =
    document.getElementById("teacher").value.trim();

  const classType =
    document.getElementById("classType").value;

  if(!className || !subject || !teacher){
    showMessage("Please complete all fields.");
    return;
  }

  const id = createId();

  const classData = {
    id:id,
    className:className,
    subject:subject,
    teacher:teacher,
    classType:classType,
    status:"active",
    createdAt:new Date().toISOString(),
    createdBy:"CEO"
  };

  try{

    await firebaseSet(
      CLASSES_PATH + "/" + id,
      classData
    );

    showMessage("✅ Class created successfully.");

    document.getElementById("className").value="";
    document.getElementById("subject").value="";
    document.getElementById("teacher").value="";
    document.getElementById("classType").value="Regular Class";

    loadClasses();

  }catch(error){

    console.error(error);
    showMessage("❌ Failed to create class. Check your Firebase connection.");

  }
}

async function loadClasses(){

  const list =
    document.getElementById("classesList");

  list.innerHTML =
    '<div class="empty">Loading classes...</div>';

  try{

    const data =
      await firebaseGet(CLASSES_PATH);

    const classes = data
      ? Object.values(data)
      : [];

    updateStats(classes);

    if(classes.length === 0){

      list.innerHTML =
        '<div class="empty">No classes created yet.</div>';

      return;
    }

    classes.sort((a,b)=>{
      return new Date(b.createdAt || 0) -
             new Date(a.createdAt || 0);
    });

    list.innerHTML = classes.map(c => {

      const status =
        c.status || "active";

      return `
        <div class="card class-card">

          <h3>${escapeHtml(c.className || "Unnamed Class")}</h3>

          <div class="class-row">
            <strong>Subject:</strong>
            ${escapeHtml(c.subject || "-")}
          </div>

          <div class="class-row">
            <strong>Teacher:</strong>
            ${escapeHtml(c.teacher || "Not assigned")}
          </div>

          <div class="class-row">
            <strong>Type:</strong>
            ${escapeHtml(c.classType || "Regular Class")}
          </div>

          <div class="class-row">
            <strong>Status:</strong>
            <span class="badge">
              ${escapeHtml(status)}
            </span>
          </div>

          <div class="actions">
            <button class="view"
              onclick='viewClass(${JSON.stringify(c)})'>
              View
            </button>

            <button class="delete"
              onclick="removeClass('${c.id}')">
              Delete
            </button>
          </div>

        </div>
      `;

    }).join("");

  }catch(error){

    console.error(error);

    list.innerHTML =
      '<div class="empty">❌ Unable to load classes.</div>';

  }
}

function updateStats(classes){

  const total = classes.length;

  const active =
    classes.filter(c =>
      (c.status || "active") === "active"
    ).length;

  const assigned =
    classes.filter(c =>
      c.teacher &&
      c.teacher.trim() !== ""
    ).length;

  document.getElementById("totalCount").textContent =
    total;

  document.getElementById("activeCount").textContent =
    active;

  document.getElementById("assignedCount").textContent =
    assigned;
}

function viewClass(c){

  alert(
    "📚 CLASS DETAILS\n\n" +
    "Class: " + (c.className || "-") + "\n" +
    "Subject: " + (c.subject || "-") + "\n" +
    "Teacher: " + (c.teacher || "-") + "\n" +
    "Type: " + (c.classType || "-") + "\n" +
    "Status: " + (c.status || "-")
  );

}

async function removeClass(id){

  if(!id) return;

  const confirmDelete =
    confirm(
      "Are you sure you want to delete this class?"
    );

  if(!confirmDelete) return;

  try{

    await firebaseDelete(
      CLASSES_PATH + "/" + id
    );

    showMessage("✅ Class deleted.");

    loadClasses();

  }catch(error){

    console.error(error);

    showMessage(
      "❌ Could not delete the class."
    );

  }
}

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* CEO protection */
(function(){

  try{

    if(typeof protectCEOPage === "function"){
      protectCEOPage();
    }

  }catch(error){
    console.log("CEO protection handled by ceo.js");
  }

})();

loadClasses();
</script></body>
</html>
