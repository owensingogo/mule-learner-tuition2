<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Live Classes | CEO | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer}
.back{background:#fff;color:#173b8f}
.container{max-width:900px;margin:auto;padding:18px}
.hero{background:#173b8f;color:#fff;padding:20px;border-radius:14px;margin-bottom:16px}
.card{background:#fff;padding:16px;border-radius:14px;margin-bottom:14px;box-shadow:0 3px 12px #0001}
.class{border:1px solid #e3e7ef;border-radius:12px;padding:13px;margin-top:10px}
.live{color:#b00020;font-weight:bold}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{background:#173b8f;color:#fff}
.video{background:#111;border-radius:10px;overflow:hidden}
video{width:100%;background:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.remote{background:#111;border-radius:10px;overflow:hidden}
.remote video{height:180px;object-fit:cover}
.label{font-size:12px;color:#777;padding:8px}
.status{background:#eef3ff;padding:10px;border-radius:9px;margin-bottom:12px}
#messages{height:170px;overflow:auto;border:1px solid #ddd;border-radius:9px;padding:8px}
.msg{font-size:13px;padding:6px;border-bottom:1px solid #eee}
.chat{display:flex;gap:7px;margin-top:8px}
.chat input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px}
</style>
</head>

<body>

<header>
<b>👑 Mule Learner Tuition</b>
<button class="back" onclick="location.href='dashboard.html'">CEO Dashboard</button>
</header>

<div class="container">

<div class="hero">
<h2>Live Classes</h2>
<div>Monitor and join active classrooms</div>
</div>

<div id="list"></div>

<div id="classroom" style="display:none">

<div class="card">
<h2 id="title">Live Class</h2>
<div id="info"></div>
<div class="status" id="status">Connecting...</div>
</div>

<div class="card">
<b>🎥 CEO Camera</b>
<div class="video">
<video id="localVideo" autoplay muted playsinline></video>
</div>

<div class="actions">
<button onclick="toggleMic()" id="micBtn">
🎤 Mic Off
</button>

<button onclick="toggleCamera()" id="camBtn">
📷 Camera Off
</button>

<button onclick="leaveClass()">
Leave Class
</button>
</div>
</div>

<div class="card">
<b>👥 Participants: <span id="count">0</span></b>
</div>

<div class="card">
<b>📹 Teacher / Participants</b>
<div id="videos" class="grid"></div>
</div>

<div class="card">
<b>💬 Live Chat</b>
<div id="messages"></div>

<div class="chat">
<input id="chatInput" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>
</div>

</div>

</div>

<script type="module">
import{initializeApp}from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import{
 getDatabase,ref,get,set,update,onValue,onChildAdded,
 push,onDisconnect,remove
}from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCRUQ0WJTsN5kQ5De-MGoN8Bd6u2t2vvmLF7M",
 authDomain:"mule-learner-tuition-264fe.firebaseapp.com",
 databaseURL:"https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",
 projectId:"mule-learner-tuition-264fe",
 storageBucket:"mule-learner-tuition-264fe.firebasestorage.app",
 messagingSenderId:"656883565460",
 appId:"1:656883565460:web:3aaa6a5b638a34a6d28581"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const session=JSON.parse(localStorage.getItem("muleCurrentUser")||"null");

if(!session||session.role!=="ceo"){
 alert("CEO login required.");
 location.href="../login.html";
}

const ceoId=session.id||"CEO-MULE-001";

let liveId=null;
let localStream=null;
let pc=null;
let mic=false;
let camera=false;
let processed=new Set();

const selectedId=
 new URLSearchParams(location.search).get("id");

/* =========================
   LOAD LIVE CLASSES
========================= */

async function loadClasses(){

 const snap=await get(ref(db,"liveClasses"));

 const box=document.getElementById("list");
 box.innerHTML="";

 if(!snap.exists()){
   box.innerHTML=
     '<div class="card">No live classes available.</div>';
   return;
 }

 const items=[];

 snap.forEach(x=>{
   const v=x.val();

   if(v.status==="live")
     items.push(v);
 });

 if(!items.length){
   box.innerHTML=
     '<div class="card">No classes are currently live.</div>';
   return;
 }

 items.reverse();

 items.forEach(v=>{

   const div=document.createElement("div");
   div.className="card class";

   div.innerHTML=`
     <b>${escapeHTML(v.title||"Live Class")}</b>
     <div>
       ${escapeHTML(v.subject||"")}
       •
       ${escapeHTML(v.level||v.grade||"")}
     </div>
     <div class="live">🔴 LIVE</div>
     <div class="actions">
       <button data-id="${escapeHTML(v.id||"")}">
         Join / Monitor
       </button>
     </div>
   `;

   div.querySelector("button").onclick=()=>{
     location.href=
       "live-classes.html?id="+encodeURIComponent(v.id);
   };

   box.appendChild(div);
 });
}

async function join(){

 liveId=selectedId;

 if(!liveId){
   await loadClasses();
   return;
 }

 document.getElementById("list").style.display="none";
 document.getElementById("classroom").style.display="block";

 const snap=await get(ref(db,"liveClasses/"+liveId));

 if(!snap.exists()){
   document.getElementById("status").textContent=
     "Live class not found.";
   return;
 }

 const live=snap.val();

 if(live.status!=="live"){
   document.getElementById("status").textContent=
     "This class is no longer live.";
   return;
 }

 document.getElementById("title").textContent=
   live.title||"Live Class";

 document.getElementById("info").textContent=
   (live.subject||"")+
   " • "+
   (live.level||live.grade||"");

 await startWebRTC();
 listenParticipants();
 listenChat();
}

/* =========================
   CEO WEBRTC PARTICIPANT
========================= */

async function startWebRTC(){

 try{

   localStream=
     await navigator.mediaDevices.getUserMedia({
       video:true,
       audio:true
     });

   localStream.getAudioTracks()
     .forEach(t=>t.enabled=false);

   localStream.getVideoTracks()
     .forEach(t=>t.enabled=false);

   document.getElementById("localVideo").srcObject=
     localStream;

 }catch(e){
   console.log(e);
 }

 const participantRef=
   ref(db,
   `liveClasses/${liveId}/participants/${ceoId}`
   );

 await set(participantRef,{
   id:ceoId,
   name:session.name||"CEO",
   role:"ceo",
   mic:false,
   camera:false,
   joinedAt:Date.now()
 });

 onDisconnect(participantRef).remove();

 pc=new RTCPeerConnection({
   iceServers:[
     {urls:"stun:stun.l.google.com:19302"},
     {urls:"stun:stun1.l.google.com:19302"}
   ]
 });

 if(localStream){
   localStream.getTracks().forEach(track=>{
     pc.addTrack(track,localStream);
   });
 }

 pc.ontrack=e=>{

   if(!e.streams[0])return;

   let video=document.getElementById("teacherVideo");

   if(!video){

     const box=document.createElement("div");
     box.className="remote";
     box.innerHTML=
       '<video id="teacherVideo" autoplay playsinline></video>'+
       '<div class="label">Teacher / Classroom</div>';

     document.getElementById("videos")
       .prepend(box);

     video=document.getElementById("teacherVideo");
   }

   video.srcObject=e.streams[0];
 };

 pc.onicecandidate=e=>{

   if(!e.candidate)return;

   const key=push(ref(db,
     `liveClasses/${liveId}/participants/${ceoId}/participantCandidates`
   )).key;

   set(ref(db,
     `liveClasses/${liveId}/participants/${ceoId}/participantCandidates/${key}`
   ),e.candidate.toJSON());
 };

 onValue(ref(db,
   `liveClasses/${liveId}/participants/${ceoId}/offer`
 ),async snap=>{

   if(!snap.exists())return;

   try{

     if(pc.currentRemoteDescription)return;

     await pc.setRemoteDescription(snap.val());

     const answer=await pc.createAnswer();

     await pc.setLocalDescription(answer);

     await set(ref(db,
       `liveClasses/${liveId}/participants/${ceoId}/answer`
     ),{
       type:answer.type,
       sdp:answer.sdp
     });

     document.getElementById("status").textContent=
       "🟢 Connected to live classroom";

   }catch(e){
     console.error(e);
   }
 });

 onChildAdded(ref(db,
   `liveClasses/${liveId}/participants/${ceoId}/teacherCandidates`
 ),async snap=>{

   if(processed.has(snap.key))return;
   processed.add(snap.key);

   try{
     await pc.addIceCandidate(snap.val());
   }catch(e){}
 });

 document.getElementById("status").textContent=
   "Waiting for teacher...";
}

function listenParticipants(){

 onValue(ref(db,
   `liveClasses/${liveId}/participants`
 ),snap=>{

   const data=snap.val()||{};
   const people=Object.values(data);

   document.getElementById("count").textContent=
     people.length;
 });
}

window.toggleMic=async function(){

 if(!localStream)return;

 mic=!mic;

 localStream.getAudioTracks()
 .forEach(t=>t.enabled=mic);

 await update(ref(db,
   `liveClasses/${liveId}/participants/${ceoId}`
 ),{mic});

 document.getElementById("micBtn").textContent=
   mic?"🎤 Mic On":"🎤 Mic Off";
};

window.toggleCamera=async function(){

 if(!localStream)return;

 camera=!camera;

 localStream.getVideoTracks()
 .forEach(t=>t.enabled=camera);

 await update(ref(db,
   `liveClasses/${liveId}/participants/${ceoId}`
 ),{camera});

 document.getElementById("camBtn").textContent=
   camera?"📷 Camera On":"📷 Camera Off";
};

window.leaveClass=async function(){

 try{

   if(pc)pc.close();

   if(localStream)
     localStream.getTracks().forEach(t=>t.stop());

   await remove(ref(db,
     `liveClasses/${liveId}/participants/${ceoId}`
   ));

 }catch(e){}

 location.href="live-classes.html";
};

/* =========================
   CHAT
========================= */

function listenChat(){

 onChildAdded(ref(db,
   `liveClasses/${liveId}/chat`
 ),snap=>{

   const m=snap.val();

   const div=document.createElement("div");
   div.className="msg";
   div.textContent=
     (m.name||"User")+": "+(m.message||"");

   document.getElementById("messages")
     .appendChild(div);

   const box=document.getElementById("messages");
   box.scrollTop=box.scrollHeight;
 });
}

window.sendMessage=async function(){

 const input=document.getElementById("chatInput");
 const message=input.value.trim();

 if(!message)return;

 const key=push(ref(db,
   `liveClasses/${liveId}/chat`
 )).key;

 await set(ref(db,
   `liveClasses/${liveId}/chat/${key}`
 ),{
   name:session.name||"CEO",
   role:"ceo",
   message,
   createdAt:Date.now()
 });

 input.value="";
};

function escapeHTML(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

if(selectedId)
 join().catch(e=>console.error(e));
else
 loadClasses().catch(e=>console.error(e));
</script>

</body>
</html>
