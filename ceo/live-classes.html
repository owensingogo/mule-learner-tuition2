<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>CEO Live Classes | Mule Learner Tuition</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:15px;display:flex;justify-content:space-between}
header b{font-size:17px}
header a{color:#fff;text-decoration:none;font-size:12px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:14px;box-shadow:0 3px 12px #0001}
h1{font-size:22px;color:#173b8f;margin:5px 0}
h2{font-size:15px;margin:5px 0 12px}
p{font-size:12px;color:#667085}
input{width:100%;padding:11px;margin:4px 0 8px;border:1px solid #d8deea;border-radius:8px}
button{border:0;border-radius:8px;padding:10px;font-weight:bold;font-size:11px}
.create{width:100%;background:#173b8f;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;background:#eef3ff;padding:12px;border-radius:10px}
.stat b{display:block;font-size:20px;color:#173b8f}
.stat small{font-size:10px}
.class{border-left:4px solid #173b8f}
.top{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:bold;font-size:14px}
.info{font-size:11px;color:#667085;margin-top:4px}
.badge{font-size:9px;background:#eef3ff;color:#173b8f;padding:5px 8px;border-radius:15px;height:max-content}
.live{background:#ecfdf3;color:#087443}
.row{display:flex;justify-content:space-between;font-size:11px;padding:5px 0}
.actions{display:flex;gap:7px;margin-top:8px}
.open{background:#173b8f;color:#fff;flex:1}
.del{background:#fee4e2;color:#b42318;flex:1}
.empty{text-align:center;color:#667085;font-size:12px;padding:20px}
#room{display:none}
video{width:100%;height:230px;object-fit:cover;background:#111;border-radius:10px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.control{background:#eef3ff;color:#173b8f}
.active{background:#173b8f;color:#fff}
.end{width:100%;background:#b42318;color:#fff;margin-top:8px}
.chat{margin-top:12px}
.messages{height:100px;overflow:auto;background:#f7f8fb;padding:8px;font-size:11px;border-radius:8px}
.chatrow{display:flex;gap:6px;margin-top:6px}
.chatrow input{margin:0}
.send{background:#173b8f;color:#fff}
</style></head><body><header>
<b>Mule Learner Tuition</b>
<a href="dashboard.html">← CEO Dashboard</a>
</header><main><div class="card">
<h1>CEO Live Classes 👑🔴</h1>
<p>Schedule and conduct live classes directly from the CEO account.</p>
</div><div class="card">
<h2>Schedule Live Class</h2><input id="name" placeholder="Class name e.g. Grade 10 Mathematics">
<input id="subject" placeholder="Subject e.g. Mathematics">
<input id="teacher" placeholder="Teacher name or CEO">
<input id="date" type="date">
<input id="time" type="time"><button class="create" onclick="schedule()">+ Schedule Live Class</button>

</div><div class="stats card">
<div class="stat"><b id="live">0</b><small>Live Now</small></div>
<div class="stat"><b id="scheduled">0</b><small>Scheduled</small></div>
<div class="stat"><b id="learners">0</b><small>Learners</small></div>
</div><div id="list"></div><div id="empty" class="card empty">
No live classes scheduled yet.
</div><div id="room" class="card"><h2 id="roomName">CEO Teaching Room</h2><video id="video" autoplay muted playsinline></video>

<div class="controls"><button id="mic" class="control active" onclick="mic()">🎤 Mic ON</button>

<button id="cam" class="control" onclick="camera()">📷 Camera OFF</button>

<button id="speaker" class="control active" onclick="speaker()">🔊 Speaker ON</button>

<button class="control" onclick="full()">⛶ Fullscreen</button>

<button class="control" onclick="testLearner()">👥 Test Learner</button>

</div><button class="end" onclick="endClass()">⛔ End CEO Class</button>

<div class="chat"><h2>💬 Live Chat</h2><div id="messages" class="messages">
<b>System:</b> CEO teaching room ready.
</div><div class="chatrow">
<input id="chat" placeholder="Type a message...">
<button class="send" onclick="send()">Send</button>
</div></div></div></main><script src="../js/auth.js"></script><script src="../js/app.js"></script><script src="../js/ceo.js"></script><script>

const DB="https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com";

let data=[];
let current=null;
let stream=null;
let micStream=null;
let micOn=true;
let camOn=false;
let speakerOn=true;
let learnerNumber=0;
let timer;
let seconds=0;


/* FIREBASE */

async function get(path){
 let r=await fetch(DB+"/"+path+".json");
 if(!r.ok)throw Error("Firebase error");
 return r.json();
}

async function put(path,data){
 let r=await fetch(DB+"/"+path+".json",{
  method:"PUT",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(data)
 });
 if(!r.ok)throw Error("Firebase error");
 return r.json();
}

async function patch(path,data){
 let r=await fetch(DB+"/"+path+".json",{
  method:"PATCH",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(data)
 });
 if(!r.ok)throw Error("Firebase error");
}

async function del(path){
 await fetch(DB+"/"+path+".json",{method:"DELETE"});
}


/* LOAD */

async function load(){

 try{

  let x=await get("liveClasses");

  data=x?Object.values(x):[];

  data.sort((a,b)=>
   new Date(b.createdAt||0)-new Date(a.createdAt||0)
  );

  render();

 }catch(e){

  console.log(e);

  document.getElementById("empty").textContent=
  "Unable to connect to Firebase.";

 }

}


/* SCHEDULE */

async function schedule(){

 let n=document.getElementById("name").value.trim();
 let s=document.getElementById("subject").value.trim();
 let t=document.getElementById("teacher").value.trim();
 let d=document.getElementById("date").value;
 let tm=document.getElementById("time").value;

 if(!n||!s||!t||!d||!tm){
  alert("Please complete all fields.");
  return;
 }

 let id="LIVE-"+Date.now();

 let item={
  id:id,
  name:n,
  className:n,
  subject:s,
  teacher:t,
  date:d,
  time:tm,
  status:"SCHEDULED",
  learnerCount:0,
  createdAt:new Date().toISOString()
 };

 try{

  await put("liveClasses/"+id,item);

  alert("✅ Live class scheduled.");

  ["name","subject","teacher","date","time"]
  .forEach(x=>document.getElementById(x).value="");

  load();

 }catch(e){

  alert("❌ Could not save class to Firebase.");

 }

}


/* DISPLAY */

function render(){

 let list=document.getElementById("list");

 list.innerHTML="";

 let live=data.filter(x=>x.status==="LIVE");
 let scheduled=data.filter(x=>x.status==="SCHEDULED");

 document.getElementById("live").textContent=live.length;
 document.getElementById("scheduled").textContent=scheduled.length;

 let total=0;

 data.forEach(x=>total+=Number(x.learnerCount||0));

 if(current)total=learnerNumber;

 document.getElementById("learners").textContent=total;

 document.getElementById("empty").style.display=
 data.length?"none":"block";

 data.forEach(x=>{

  let div=document.createElement("div");

  div.className="card class";

  div.innerHTML=`

  <div class="top">

   <div>
    <div class="name">${safe(x.name||x.className)}</div>
    <div class="info">
    ${safe(x.subject)} • ${safe(x.teacher)}
    </div>
   </div>

   <span class="badge ${x.status==="LIVE"?"live":""}">
   ${x.status==="LIVE"?"LIVE":"SCHEDULED"}
   </span>

  </div>

  <hr>

  <div class="row">
  <span>Date</span><b>${safe(x.date)}</b>
  </div>

  <div class="row">
  <span>Time</span><b>${safe(x.time)}</b>
  </div>

  <div class="row">
  <span>Learners</span><b>${Number(x.learnerCount||0)}</b>
  </div>

  <div class="actions">

  <button class="open" onclick="teach('${x.id}')">
  ${x.status==="LIVE"?"⏹ Open Class":"👑 Teach Class"}
  </button>

  <button class="del" onclick="removeClass('${x.id}')">
  Remove
  </button>

  </div>
  `;

  list.appendChild(div);

 });

}


/* TEACH */

async function teach(id){

 current=data.find(x=>x.id===id);

 if(!current)return;

 try{

  await patch("liveClasses/"+id,{
   status:"LIVE",
   startedAt:new Date().toISOString()
  });

  learnerNumber=Number(current.learnerCount||0);

  document.getElementById("room").style.display="block";

  document.getElementById("roomName").textContent=
  current.name||current.className;

  document.getElementById("room")
  .scrollIntoView({behavior:"smooth"});

  startTimer();

  addMessage("System","CEO has started the live class.");

  load();

 }catch(e){

  alert("❌ Could not start the live class.");

 }

}


/* TIMER */

function startTimer(){

 seconds=0;

 clearInterval(timer);

 timer=setInterval(()=>{

  seconds++;

 },1000);

}


/* CAMERA */

async function camera(){

 if(camOn){

  if(stream)stream.getTracks().forEach(x=>x.stop());

  stream=null;
  camOn=false;

  document.getElementById("video").srcObject=null;

  document.getElementById("cam").textContent=
  "📷 Camera OFF";

  document.getElementById("cam").classList.remove("active");

  return;

 }

 try{

  stream=await navigator.mediaDevices.getUserMedia({
   video:true
  });

  document.getElementById("video").srcObject=stream;

  camOn=true;

  document.getElementById("cam").textContent=
  "📷 Camera ON";

  document.getElementById("cam").classList.add("active");

 }catch(e){

  alert("Camera permission was not granted.");

 }

}


/* MICROPHONE */

async function mic(){

 if(!micStream){

  try{

   micStream=await navigator.mediaDevices.getUserMedia({
    audio:true
   });

  }catch(e){

   alert("Microphone permission was not granted.");
   return;

  }

 }

 micOn=!micOn;

 micStream.getAudioTracks().forEach(x=>{
  x.enabled=micOn;
 });

 document.getElementById("mic").textContent=
 micOn?"🎤 Mic ON":"🎤 Mic OFF";

 document.getElementById("mic").classList.toggle(
 "active",micOn);

}


/* SPEAKER */

function speaker(){

 speakerOn=!speakerOn;

 document.getElementById("video").muted=!speakerOn;

 document.getElementById("speaker").textContent=
 speakerOn?"🔊 Speaker ON":"🔇 Speaker OFF";

 document.getElementById("speaker").classList.toggle(
 "active",speakerOn);

}


/* FULLSCREEN */

function full(){

 let r=document.getElementById("room");

 if(!document.fullscreenElement)
  r.requestFullscreen().catch(()=>{});
 else
  document.exitFullscreen();

}


/* TEST LEARNER */

async function testLearner(){

 if(!current){
  alert("Start a class first.");
  return;
 }

 learnerNumber++;

 try{

  await patch(
   "liveClasses/"+current.id,
   {learnerCount:learnerNumber}
  );

 }catch(e){}

 document.getElementById("learners").textContent=
 learnerNumber;

}


/* CHAT */

async function send(){

 let input=document.getElementById("chat");
 let text=input.value.trim();

 if(!text)return;

 addMessage("CEO",text);

 input.value="";

 if(!current)return;

 let id="MSG-"+Date.now();

 await put(
 "liveClasses/"+current.id+"/chat/"+id,
 {
  sender:"CEO",
  text:text,
  createdAt:new Date().toISOString()
 }
 );

}


function addMessage(sender,text){

 let box=document.getElementById("messages");

 box.innerHTML+=
 "<div><b>"+safe(sender)+":</b> "+
 safe(text)+"</div>";

 box.scrollTop=box.scrollHeight;

}


/* END */

async function endClass(){

 if(!current)return;

 if(!confirm("End the CEO live class?"))return;

 try{

  await patch(
   "liveClasses/"+current.id,
   {
    status:"SCHEDULED",
    endedAt:new Date().toISOString()
   }
  );

 }catch(e){

  alert("Could not update Firebase.");
  return;

 }

 if(stream)stream.getTracks().forEach(x=>x.stop());
 if(micStream)micStream.getTracks().forEach(x=>x.stop());

 stream=null;
 micStream=null;

 clearInterval(timer);

 camOn=false;
 micOn=true;

 document.getElementById("video").srcObject=null;
 document.getElementById("room").style.display="none";

 document.getElementById("cam").textContent="📷 Camera OFF";
 document.getElementById("mic").textContent="🎤 Mic ON";

 document.getElementById("cam").classList.remove("active");
 document.getElementById("mic").classList.add("active");

 current=null;

 load();

}


/* REMOVE */

async function removeClass(id){

 if(!confirm("Remove this live class from Firebase?"))return;

 if(current&&current.id===id){
  alert("End the live class first.");
  return;
 }

 try{

  await del("liveClasses/"+id);

  alert("✅ Live class removed.");

  load();

 }catch(e){

  alert("❌ Could not remove the class.");

 }

}


/* SECURITY */

function safe(x){

 let d=document.createElement("div");

 d.textContent=String(x??"");

 return d.innerHTML;

}


/* CEO PAGE */

try{

 if(typeof protectCEOPage==="function")
  protectCEOPage();

}catch(e){}


/* START */

load();

setInterval(()=>{

 if(!current)load();

},10000);

</script></body>
</html>
