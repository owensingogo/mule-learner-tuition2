<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#173b8f">

<title>Live Class Monitor | Mule Learner Tuition</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fc;
  color:#172033
}

header{
  background:#173b8f;
  color:white;
  padding:13px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  font-weight:bold;
  font-size:15px
}

.logout{
  border:0;
  background:white;
  color:#173b8f;
  padding:7px 12px;
  border-radius:7px;
  font-weight:bold
}

.container{
  max-width:900px;
  margin:auto;
  padding:14px
}

h2{
  margin:8px 0 12px
}

h3{
  margin:4px 0 10px;
  font-size:15px
}

.card{
  background:white;
  border-radius:13px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #0000000d
}

/* STATUS */

.status{
  font-size:13px;
  padding:9px;
  border-radius:8px;
  background:#eef3ff;
  margin-bottom:10px
}

/* TEACHER VIDEO */

.teacher{
  position:relative;
  background:#111;
  border-radius:13px;
  overflow:hidden
}

#teacherVideo{
  width:100%;
  height:220px;
  display:block;
  object-fit:cover;
  background:#111
}

.label{
  position:absolute;
  bottom:10px;
  left:10px;
  background:#000b;
  color:white;
  padding:7px 10px;
  border-radius:7px;
  font-size:12px
}

/* LEARNERS */

.learners{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px
}

.learner{
  min-width:95px;
  width:95px;
  height:70px;
  background:#111;
  border-radius:8px;
  overflow:hidden;
  position:relative;
  flex-shrink:0
}

.learner video{
  width:95px;
  height:70px;
  object-fit:cover;
  display:block
}

.name{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:#000b;
  color:white;
  padding:5px;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

/* CONTROLS */

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px
}

button{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  font-weight:bold;
  cursor:pointer
}

.blue{
  background:#173b8f;
  color:white
}

.red{
  background:#c62828;
  color:white
}

.gray{
  background:#e8edf5;
  color:#172033
}

/* INFO */

.info{
  font-size:13px;
  line-height:1.7
}

/* CHAT */

.chat{
  max-height:220px;
  overflow-y:auto;
  background:#f5f7fb;
  padding:8px;
  border-radius:8px
}

.message{
  background:white;
  padding:7px 9px;
  border-radius:7px;
  margin-bottom:6px;
  font-size:12px
}

.empty{
  text-align:center;
  color:#777;
  font-size:12px;
  padding:15px
}

/* DESKTOP */

@media(min-width:700px){

  #teacherVideo{
    height:320px
  }

  .learner{
    min-width:120px;
    width:120px;
    height:85px
  }

  .learner video{
    width:120px;
    height:85px
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    📚 Mule Learner Tuition
  </div>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</header>

<div class="container">

  <h2>👑 Live Class Monitor</h2>

  <!-- STATUS -->

  <div class="card">

    <div id="status" class="status">
      Connecting to live class...
    </div>

  </div>

  <!-- TEACHER -->

  <div class="card">

    <h3>👨‍🏫 Teacher</h3>

    <div class="teacher">

      <video
        id="teacherVideo"
        autoplay
        playsinline>
      </video>

      <div class="label">
        👨‍🏫 Teacher
      </div>

    </div>

    <div class="controls">

      <button
        class="blue"
        onclick="enableSound()">
        🔊 Enable Sound
      </button>

      <button
        class="gray"
        onclick="toggleMic()"
        id="micBtn">
        🎤 Mic Off
      </button>

      <button
        class="gray"
        onclick="toggleCamera()"
        id="cameraBtn">
        📹 Camera Off
      </button>

      <button
        class="red"
        onclick="leaveClass()">
        🚪 Leave Monitor
      </button>

    </div>

  </div>

  <!-- LEARNERS -->

  <div class="card">

    <h3>👨‍🎓 Learners</h3>

    <div
      class="learners"
      id="learners">

      <div class="empty">
        No learners connected yet.
      </div>

    </div>

  </div>

  <!-- CLASS INFORMATION -->

  <div class="card">

    <h3>Class Information</h3>

    <div class="info">

      <b>Subject:</b>
      <span id="subject">Loading...</span>
      <br>

      <b>Level:</b>
      <span id="level">Loading...</span>
      <br>

      <b>Teacher:</b>
      <span id="teacherName">Loading...</span>
      <br>

      <b>Participants:</b>
      <span id="participantCount">0</span>

    </div>

  </div>

  <!-- CHAT -->

  <div class="card">

    <h3>💬 Class Chat</h3>

    <div id="chat" class="chat">

      <div class="empty">
        No messages yet.
      </div>

    </div>

  </div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove,
  onValue,
  push
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig={

  apiKey:
  "AIzaSyCRUQW0JTsN5kQ5De-MgoN8Bd6u2t2vvmLF7M",

  authDomain:
  "mule-learner-tuition-264fe.firebaseapp.com",

  databaseURL:
  "https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",

  projectId:
  "mule-learner-tuition-264fe",

  storageBucket:
  "mule-learner-tuition-264fe.firebasestorage.app",

  messagingSenderId:
  "656883565460",

  appId:
  "1:656883565460:web:3aaa6a5b638a34a6d28581"
};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* SESSION */

const session=JSON.parse(
  localStorage.getItem("muleCurrentUser")||"null"
);

if(
  !session ||
  session.role!=="ceo"
){

  location.href="../login.html";

}


const ceoId=session.id||"CEO-MULE-001";

const ceoName=session.name||"CEO";


/* CLASS ID */

const params=
new URLSearchParams(
  location.search
);

const CLASS_ID=
params.get("id");


if(!CLASS_ID){

  document.getElementById("status")
  .textContent=
  "No live class selected.";

  throw new Error(
    "Missing live class ID"
  );

}


/* REFERENCES */

const liveRef=
ref(
  db,
  "liveClasses/"+CLASS_ID
);

const participantsRef=
ref(
  db,
  "liveClasses/"+CLASS_ID+
  "/participants"
);


/* WEBRTC */

let localStream=null;

let peer=null;

let remoteStream=null;

let candidateQueue=[];

let remoteDescriptionSet=false;


/* STUN */

const configuration={

  iceServers:[

    {
      urls:
      "stun:stun.l.google.com:19302"
    },

    {
      urls:
      "stun:stun1.l.google.com:19302"
    }

  ],

  iceCandidatePoolSize:10

};


/* LOAD CLASS */

async function loadClass(){

  const snap=
  await get(liveRef);

  if(!snap.exists()){

    document.getElementById(
      "status"
    ).textContent=
    "Live class not found.";

    return;

  }


  const data=snap.val()||{};


  document.getElementById(
    "subject"
  ).textContent=
  data.subject||"Mathematics";


  document.getElementById(
    "level"
  ).textContent=
  data.level||"Grade 10";


  document.getElementById(
    "teacherName"
  ).textContent=
  data.teacherName||"Teacher";


  if(data.status!=="live"){

    document.getElementById(
      "status"
    ).textContent=
    "This class is not currently live.";

    return;

  }


  document.getElementById(
    "status"
  ).textContent=
  "🟢 Live — CEO monitoring";


  joinMonitor();

}


/* JOIN MONITOR */

async function joinMonitor(){

  try{

    /*
      CEO joins with camera and
      microphone OFF by default.
    */

    await set(

      ref(
        db,
        "liveClasses/"+CLASS_ID+
        "/participants/"+ceoId
      ),

      {
        role:"ceo",
        name:ceoName,
        joinedAt:
        new Date().toISOString()
      }

    );


    listenParticipants();

    listenChat();

    setupPeer();

  }catch(error){

    console.error(error);

    document.getElementById(
      "status"
    ).textContent=
    "Unable to join live class.";

  }

}


/* PEER */

function setupPeer(){

  peer=
  new RTCPeerConnection(
    configuration
  );


  remoteStream=
  new MediaStream();


  document.getElementById(
    "teacherVideo"
  ).srcObject=
  remoteStream;


  /*
    Receive teacher audio/video.
  */

  peer.addTransceiver(
    "audio",
    {
      direction:"recvonly"
    }
  );


  peer.addTransceiver(
    "video",
    {
      direction:"recvonly"
    }
  );


  peer.ontrack=event=>{

    if(event.streams[0]){

      event.streams[0]
      .getTracks()
      .forEach(track=>{

        if(
          !remoteStream
          .getTrackById(track.id)
        ){

          remoteStream
          .addTrack(track);

        }

      });

    }

  };


  peer.onconnectionstatechange=()=>{

    console.log(
      "CEO monitor connection:",
      peer.connectionState
    );

    if(
      peer.connectionState==="connected"
    ){

      document.getElementById(
        "status"
      ).textContent=
      "🟢 Connected — monitoring live class";

    }

  };


  peer.onicecandidate=
  async event=>{

    if(!event.candidate) return;


    const key=
    push(

      ref(
        db,
        "liveClasses/"+CLASS_ID+
        "/participants/"+ceoId+
        "/participantCandidates"
      )

    ).key;


    await set(

      ref(
        db,
        "liveClasses/"+CLASS_ID+
        "/participants/"+ceoId+
        "/participantCandidates/"+key
      ),

      event.candidate.toJSON()

    );

  };


  /*
    Teacher offer.
  */

  onValue(

    ref(
      db,
      "liveClasses/"+CLASS_ID+
      "/participants/"+ceoId+
      "/offer"
    ),

    async snapshot=>{

      const offer=
      snapshot.val();

      if(!offer) return;


      try{

        await peer.setRemoteDescription(
          new RTCSessionDescription(
            offer
          )
        );


        remoteDescriptionSet=true;


        for(
          const candidate
          of candidateQueue
        ){

          await peer.addIceCandidate(
            new RTCIceCandidate(
              candidate
            )
          );

        }


        candidateQueue=[];


        const answer=
        await peer.createAnswer();


        await peer.setLocalDescription(
          answer
        );


        await set(

          ref(
            db,
            "liveClasses/"+CLASS_ID+
            "/participants/"+ceoId+
            "/answer"
          ),

          {
            type:answer.type,
            sdp:answer.sdp
          }

        );

      }catch(error){

        console.error(
          "CEO offer error:",
          error
        );

      }

    }

  );


  /*
    Teacher ICE candidates.
  */

  onValue(

    ref(
      db,
      "liveClasses/"+CLASS_ID+
      "/participants/"+ceoId+
      "/teacherCandidates"
    ),

    async snapshot=>{

      const data=
      snapshot.val()||{};


      for(
        const candidate
        of Object.values(data)
      ){

        try{

          if(remoteDescriptionSet){

            await peer.addIceCandidate(
              new RTCIceCandidate(
                candidate
              )
            );

          }else{

            candidateQueue.push(
              candidate
            );

          }

        }catch(error){

          console.error(error);

        }

      }

    }

  );

}


/* PARTICIPANTS */

function listenParticipants(){

  onValue(

    participantsRef,

    snapshot=>{

      const data=
      snapshot.val()||{};


      const learners=
      Object.entries(data)
      .filter(
        ([id,p])=>
        p &&
        p.role==="learner"
      );


      renderLearners(
        learners
      );


      document.getElementById(
        "participantCount"
      ).textContent=
      Object.keys(data).length;

    }

  );

}


/* LEARNERS */

function renderLearners(
  learners
){

  const box=
  document.getElementById(
    "learners"
  );


  if(!learners.length){

    box.innerHTML=
    '<div class="empty">No learners connected yet.</div>';

    return;

  }


  box.innerHTML="";


  learners.forEach(
    ([id,data])=>{

      const div=
      document.createElement(
        "div"
      );

      div.className="learner";


      const video=
      document.createElement(
        "video"
      );

      video.autoplay=true;

      video.playsInline=true;

      video.id=
      "learner-"+id;


      /*
        The teacher is already sending
        learner video through the teacher's
        live connection. This monitor keeps
        the participant list visible.
      */


      const name=
      document.createElement(
        "div"
      );

      name.className="name";

      name.textContent=
      data.name||"Learner";


      div.appendChild(video);

      div.appendChild(name);

      box.appendChild(div);

    }
  );

}


/* CHAT */

function listenChat(){

  onValue(

    ref(
      db,
      "liveClasses/"+CLASS_ID+
      "/chat"
    ),

    snapshot=>{

      const data=
      snapshot.val()||{};


      const messages=
      Object.values(data)
      .sort(
        (a,b)=>
        new Date(a.createdAt)-
        new Date(b.createdAt)
      );


      const box=
      document.getElementById(
        "chat"
      );


      if(!messages.length){

        box.innerHTML=
        '<div class="empty">No messages yet.</div>';

        return;

      }


      box.innerHTML="";


      messages.forEach(
        item=>{

          const div=
          document.createElement(
            "div"
          );

          div.className="message";


          div.innerHTML=
          "<b>"+
          escapeHTML(
            item.senderName||"User"
          )+
          ":</b> "+
          escapeHTML(
            item.message||""
          );


          box.appendChild(div);

        }
      );


      box.scrollTop=
      box.scrollHeight;

    }

  );

}


/* ENABLE SOUND */

window.enableSound=function(){

  const video=
  document.getElementById(
    "teacherVideo"
  );

  video.muted=false;

  video.play()
  .catch(
    error=>console.log(error)
  );

};


/* CEO MIC */

window.toggleMic=function(){

  if(!localStream){

    alert(
      "CEO microphone is off by default."
    );

    return;

  }


  const track=
  localStream
  .getAudioTracks()[0];


  if(!track) return;


  track.enabled=
  !track.enabled;


  document.getElementById(
    "micBtn"
  ).textContent=
  track.enabled
  ?"🎤 Mic On"
  :"🎤 Mic Off";

};


/* CEO CAMERA */

window.toggleCamera=function(){

  if(!localStream){

    alert(
      "CEO camera is off by default."
    );

    return;

  }


  const track=
  localStream
  .getVideoTracks()[0];


  if(!track) return;


  track.enabled=
  !track.enabled;


  document.getElementById(
    "cameraBtn"
  ).textContent=
  track.enabled
  ?"📹 Camera On"
  :"📹 Camera Off";

};


/* LEAVE */

window.leaveClass=
async function(){

  try{

    await remove(

      ref(
        db,
        "liveClasses/"+CLASS_ID+
        "/participants/"+ceoId
      )

    );

  }catch(error){

    console.error(error);

  }


  if(peer){

    peer.close();

  }


  if(localStream){

    localStream
    .getTracks()
    .forEach(
      track=>track.stop()
    );

  }


  location.href=
  "dashboard.html";

};


/* ESCAPE */

function escapeHTML(value){

  return String(value)

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* LOGOUT */

window.logout=function(){

  localStorage.removeItem(
    "muleCurrentUser"
  );

  location.href=
  "../login.html";

};


/* START */

loadClass();

</script>

</body>
</html>
