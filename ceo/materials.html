<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Materials | Mule Learner Tuition</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#173b8f;color:white;padding:18px;text-align:center}
header h2{margin:0;font-size:20px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;border-radius:14px;padding:15px;margin-bottom:15px;box-shadow:0 3px 12px #0001}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
textarea{min-height:80px;resize:vertical}
button{background:#173b8f;color:white;border:0;font-weight:bold}
button.danger{background:#c62828}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#eef3ff;padding:12px;text-align:center;border-radius:10px}
.stat b{display:block;font-size:20px;color:#173b8f}
.material{border:1px solid #e1e5ec;border-radius:10px;padding:12px;margin-top:10px}
.material h3{margin:0 0 7px;color:#173b8f}
.small{font-size:13px;color:#667085}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.empty{text-align:center;color:#777;padding:20px}
</style>
</head>

<body>

<header>
  <h2>📚 CEO Materials</h2>
  <div class="small" style="color:#dce6ff">Mule Learner Tuition</div>
</header>

<main>

<div class="card">
  <h3>➕ Add Learning Material</h3>

  <input id="title" placeholder="Material title" required>

  <select id="subject" required>
    <option value="">Select Subject</option>
    <option>Mathematics</option>
    <option>English</option>
    <option>Science</option>
    <option>Physics</option>
    <option>Chemistry</option>
    <option>Biology</option>
    <option>ICT</option>
    <option>Computer Studies</option>
    <option>Other</option>
  </select>

  <select id="level" required>
    <option value="">Select Level</option>
    <option>Form 1</option>
    <option>Form 2</option>
    <option>Form 3</option>
    <option>Form 4</option>
    <option>Grade 10</option>
    <option>Grade 11</option>
    <option>Grade 12</option>
    <option>Other</option>
  </select>

  <textarea id="description" placeholder="Short description"></textarea>

  <input id="link" type="url" placeholder="Material link (optional)">

  <button onclick="addMaterial()">Publish Material</button>
</div>

<div class="card">
  <h3>📊 Material Overview</h3>
  <div class="stats">
    <div class="stat">
      <b id="total">0</b>
      Materials
    </div>
    <div class="stat">
      <b id="subjects">0</b>
      Subjects
    </div>
    <div class="stat">
      <b id="levels">0</b>
      Levels
    </div>
  </div>
</div>

<div class="card">
  <h3>📚 Published Materials</h3>
  <div id="list">
    <div class="empty">Loading materials...</div>
  </div>
</div>

</main>

<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/ceo.js"></script>

<script>
const DB="https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com";

async function getMaterials(){
  const r=await fetch(DB+"/materials.json");
  if(!r.ok) throw new Error("Could not load materials");
  const d=await r.json();
  if(!d)return[];
  return Object.values(d);
}

async function addMaterial(){
  const title=document.getElementById("title").value.trim();
  const subject=document.getElementById("subject").value;
  const level=document.getElementById("level").value;
  const description=document.getElementById("description").value.trim();
  const link=document.getElementById("link").value.trim();

  if(!title||!subject||!level){
    alert("Please enter the title, subject and level.");
    return;
  }

  const id="MAT-"+Date.now();

  const material={
    id:id,
    title:title,
    subject:subject,
    level:level,
    description:description,
    link:link,
    status:"PUBLISHED",
    createdAt:new Date().toISOString(),
    createdBy:"CEO"
  };

  try{
    const r=await fetch(DB+"/materials/"+id+".json",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(material)
    });

    if(!r.ok)throw new Error();

    alert("Material published successfully.");

    document.getElementById("title").value="";
    document.getElementById("subject").value="";
    document.getElementById("level").value="";
    document.getElementById("description").value="";
    document.getElementById("link").value="";

    loadMaterials();

  }catch(e){
    alert("Failed to publish material.");
  }
}

async function removeMaterial(id){
  if(!confirm("Remove this material?"))return;

  try{
    const r=await fetch(DB+"/materials/"+id+".json",{
      method:"DELETE"
    });

    if(!r.ok)throw new Error();

    loadMaterials();

  }catch(e){
    alert("Could not remove material.");
  }
}

function viewMaterial(link){
  if(link){
    window.open(link,"_blank");
  }else{
    alert("No material link was added.");
  }
}

async function loadMaterials(){
  const list=document.getElementById("list");

  try{
    let materials=await getMaterials();

    materials.sort((a,b)=>
      new Date(b.createdAt||0)-new Date(a.createdAt||0)
    );

    document.getElementById("total").textContent=materials.length;

    document.getElementById("subjects").textContent=
      new Set(materials.map(x=>x.subject).filter(Boolean)).size;

    document.getElementById("levels").textContent=
      new Set(materials.map(x=>x.level).filter(Boolean)).size;

    if(!materials.length){
      list.innerHTML='<div class="empty">No materials published yet.</div>';
      return;
    }

    list.innerHTML=materials.map(m=>`
      <div class="material">
        <h3>${escapeHTML(m.title||"Untitled")}</h3>

        <div class="small">
          📘 ${escapeHTML(m.subject||"")} 
          &nbsp; | &nbsp;
          🎓 ${escapeHTML(m.level||"")}
        </div>

        <p>${escapeHTML(m.description||"No description")}</p>

        <div class="actions">
          <button onclick="viewMaterial('${safeJS(m.link||"")}')">
            👁 View
          </button>

          <button class="danger"
            onclick="removeMaterial('${safeJS(m.id)}')">
            🗑 Remove
          </button>
        </div>
      </div>
    `).join("");

  }catch(e){
    list.innerHTML='<div class="empty">Unable to load materials.</div>';
  }
}

function escapeHTML(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeJS(value){
  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");
}

if(typeof protectCEOPage==="function"){
  protectCEOPage();
}

loadMaterials();
</script>

</body>
</html>
